# CI CX Pulse Control — «ревьюер-машина» (docs/TEAM-SPLIT.md §3, docs/REPO-BOOTSTRAP.md).
# Имена job'ов contracts / db / tests зафиксированы: они указаны в ruleset ветки main как обязательные проверки.
# Job'ы работают уже на пакете контрактов (без кода приложения) и усиливаются карточкой T-001 без смены имён.
name: ci
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  contracts:
    name: contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Проверка JSON-схем, OpenAPI и карточек
        run: |
          (cd backend && uv sync --frozen)
          backend/.venv/bin/python scripts/contracts_check.py
          backend/.venv/bin/python scripts/gen_tasks.py && git diff --exit-code -- docs/tasks || (echo "::error::docs/tasks устарели — запустите python scripts/gen_tasks.py"; exit 1)
      - name: Дрейф OpenAPI ↔ код (когда появится backend)
        run: |
          set -euo pipefail
          if [ -f scripts/check_openapi_drift.py ] && [ -d backend/app ]; then
            (cd backend; uv sync --frozen)
            backend/.venv/bin/python scripts/check_openapi_drift.py
          else echo "backend ещё нет — пропуск"; fi

  db:
    name: db
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: cx, POSTGRES_PASSWORD: cx, POSTGRES_DB: cx_pulse }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cx -d cx_pulse" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      PGHOST: localhost
      PGUSER: cx
      PGPASSWORD: cx
      PGDATABASE: cx_pulse
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Frozen backend dependencies
        run: cd backend && uv sync --frozen
      - name: psql
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client >/dev/null
      - name: schema.sql на чистой БД
        run: psql -v ON_ERROR_STOP=1 -q -f contracts/db/schema.sql
      - name: Все SQL-миграции идемпотентны (no-op поверх schema.sql, повторный прогон тоже)
        run: |
          set -euo pipefail
          for f in contracts/db/migrations/*.sql; do
            psql -v ON_ERROR_STOP=1 -q -f "$f"; psql -v ON_ERROR_STOP=1 -q -f "$f"
          done
      - name: Инварианты схемы
        run: |
          psql -v ON_ERROR_STOP=1 -At -c "select count(*) from information_schema.tables where table_schema='public' and table_type='BASE TABLE'" | tee /tmp/tables
          test "$(cat /tmp/tables)" -ge 84 || (echo "::error::ожидалось ≥ 84 таблиц"; exit 1)
          psql -v ON_ERROR_STOP=1 -q -c "select * from v_tickets limit 0; select * from v_map_zones limit 0; select * from v_feed_latency limit 0; select * from v_signal_normalized limit 0; select * from v_cabinet_kpi limit 0;"
      - name: Alembic (когда появится backend)
        run: |
          if [ -f backend/alembic.ini ]; then
            psql -q -c "drop schema public cascade; create schema public;"
            (cd backend && export DATABASE_URL=postgresql+psycopg://cx:cx@localhost:5432/cx_pulse && uv run --frozen alembic upgrade head && uv run --frozen alembic downgrade 0003 && uv run --frozen alembic upgrade head && uv run --frozen alembic check)
          else
            echo "backend/alembic.ini ещё нет — пропуск"
          fi

  owners:
    name: owners
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Границы слоя карточки (CODEOWNERS)
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          python - <<'PY'
          import os, subprocess, sys
          title = os.environ.get("PR_TITLE", "")
          body = os.environ.get("PR_BODY", "")
          allow = any(mark in title for mark in ("cross-layer", "contract-change")) or any(
              box in body for box in ("[x] `cross-layer`", "[x] `contract-change`")
          )
          cmd = ["python", "scripts/check_owners.py", "--base", "origin/${{ github.base_ref }}"]
          if allow:
              print("метка cross-layer/contract-change — сливает владелец L1")
              cmd.append("--allow-cross")
          raise SystemExit(subprocess.call(cmd))
          PY

  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: cd backend && uv sync --frozen
      - run: cd frontend && npm ci
      - name: Backend lint and types
        run: cd backend && uv run --frozen ruff check . && uv run --frozen ruff format --check . && uv run --frozen mypy app
      - name: Frontend lint and types
        run: cd frontend && npm run lint && npm run typecheck
      - name: Лицензии и i18n
        run: make licenses-check && python3 scripts/i18n_check.py

  backend-tests:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: cx, POSTGRES_PASSWORD: cx, POSTGRES_DB: cx_pulse_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cx" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://cx:cx@localhost:5432/cx_pulse_test
      APP_ENV: test
      LLM_PROVIDER: mock
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: PostgreSQL 16 dump/restore tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-16
          echo /usr/lib/postgresql/16/bin >> "$GITHUB_PATH"
      - run: cd backend && uv sync --frozen
      - name: Full pytest collection, isolated module shard
        run: backend/.venv/bin/python scripts/ci_test_shard.py --index ${{ matrix.shard }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-shard-${{ matrix.shard }}
          path: test-results/
          if-no-files-found: error

  frontend-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - uses: astral-sh/setup-uv@v5
      - run: cd frontend && npm ci && npm test -- --run && npm run build && npm run -s gen:types
      - run: git diff --exit-code -- frontend/src/shared/api/types.ts
      - name: Local font assets after frontend build
        run: cd backend && uv sync --frozen && uv run --frozen pytest -q tests/integration/test_no_cdn.py

  build-images:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          tags: cx-pulse-backend:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Export exact candidate image
        run: docker save cx-pulse-backend:ci | zstd -T0 -3 -o /tmp/candidate.tar.zst
      - uses: actions/upload-artifact@v4
        with:
          name: candidate-image
          path: /tmp/candidate.tar.zst
          compression-level: 0
          retention-days: 1

  e2e-smoke:
    needs: build-images
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - uses: actions/download-artifact@v4
        with: { name: candidate-image, path: /tmp/candidate-image }
      - run: zstd -dc /tmp/candidate-image/candidate.tar.zst | docker load
      - run: cd frontend && npm ci && npx playwright install --with-deps chromium
      - name: Real image, isolated Compose, all Playwright tests
        run: python3 scripts/ci_compose.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-results
          path: |
            frontend/test-results/
            docs/screenshots/trace-journey/

  tests:
    name: tests
    if: always()
    needs: [contracts, db, lint, backend-tests, frontend-tests, build-images, e2e-smoke]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Explicitly propagate failed, cancelled and skipped jobs
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os
          results = json.loads(os.environ["NEEDS_JSON"])
          failures = {name: job["result"] for name, job in results.items() if job["result"] != "success"}
          if failures:
              raise SystemExit(f"Required jobs did not succeed: {failures}")
          PY
      - uses: actions/download-artifact@v4
        with: { pattern: backend-shard-*, path: test-results }
      - name: Verify four manifests and exact full-suite union
        run: python3 scripts/ci_test_shard.py --verify test-results

  nightly:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: build-images
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - uses: actions/download-artifact@v4
        with: { name: candidate-image, path: /tmp/candidate-image }
      - run: zstd -dc /tmp/candidate-image/candidate.tar.zst | docker load
      - run: cd frontend && npm ci && npx playwright install --with-deps chromium
      - name: Demo seed <=90 seconds, active-simulator API p95 <=300ms, full browser suite
        run: python3 scripts/ci_compose.py --performance
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nightly-performance
          path: |
            frontend/performance-results/
            frontend/test-results/
