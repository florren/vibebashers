name: Mirror to GitVerse

on:
  push:
    branches: ['**']
    tags: ['**']
  delete:            # чтобы удаление веток/тегов тоже уезжало в зеркало
  workflow_dispatch: # ручной запуск

concurrency:
  group: mirror-gitverse
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push mirror to GitVerse
        env:
          GV_USER: ${{ secrets.GITVERSE_USER }}
          GV_TOKEN: ${{ secrets.GITVERSE_TOKEN }}
          GV_REPO: ${{ secrets.GITVERSE_REPO }}
        run: |
          set -euo pipefail
          # не тащим в зеркало служебные refs GitHub (pull/*), иначе push их отклонит
          git for-each-ref --format='%(refname)' refs/pull | xargs -r -n1 git update-ref -d
          git remote add gitverse "https://${GV_USER}:${GV_TOKEN}@gitverse.ru/${GV_REPO}.git"
          git push --mirror --force gitverse
