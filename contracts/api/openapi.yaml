openapi: 3.1.0
info:
  title: CX Pulse Control API
  version: 1.5.14
  summary: REST + WebSocket контракт backend (FastAPI) для рабочего места CX, экрана «Под капотом», лендинга, Telegram-бота и живых контуров демо-стенда (эмулятор площадки, Mock-АБС, аудиомониторинг)
  description: |
    Контракт соответствует ТЗ v1.4 (разделы 3.7, 6, 7, 8–12, 14, 21–22). Правила:
    - Все пути под `/api`; публичные (без роли) — под `/api/public`. Аутентификации нет (решение заказчика), роль передаётся заголовком `X-Role` (`cx_operator` | `cx_lead` | `engineer` | `jury`) только для отображения и записи актора.
    - Время: `*_at` — реальное (ISO 8601, UTC), `*_sim` — симуляционное (ISO 8601, календарь симулятора).
    - Пагинация: `limit` (по умолчанию 50, максимум 500) + `cursor` (непрозрачная строка). Ответы списков — `{items, next_cursor, total?}`.
    - Ошибки — RFC 9457 `application/problem+json`.
    - Локализация: тексты интерфейса — на фронте; API отдаёт коды и `label_ru`/`label_en` только для справочников.
    - Realtime: `GET /ws/stream` (WebSocket), сообщения по схеме `contracts/events/ws/message.schema.json`; бинарный аудиопоток — `GET /ws/audio/{session_id}`.
    - v1.4 (ДТЗ): теги `ingest` (единая схема сообщения, транскрипты, адаптеры), `tickets` (тикетница над инцидентами), `escalations`; `sentiment`/`problem_summary`/`router_action` в сигналах, инцидентах и решениях; `GET /api/agent/runs/{id}/decision-chain`; слой зон карты `GET /api/map/zones`; живой тикер `GET /api/metrics/economics/live`; пакетный анализ транскриптов `/api/compliance/transcripts/*`.
    - v1.5 (АРХ): теги `search`, `trace`, `journey` — универсальный поиск и след объекта, путь обращения (ТЗ 27–28). Для точного id `run_id` по умолчанию `all`; для текстового поиска — `current` + baseline. Новых WebSocket-топиков нет.
    - v1.3 (BRD): теги `feed`, `abs`, `rules`, `compliance`, `stt`, `demo`; роли `X-Role` дополнены `branch_manager` (руководитель отделения) и `compliance`. Живые контуры работают независимо от состояния симулятора (ТЗ 4.7): если текущего запуска нет, backend создаёт запуск `live`.
  contact:
    name: vibebashers
    url: https://gitverse.ru/florren/vibebashers
  license:
    name: MIT
servers:
  - url: http://localhost:8000
    description: backend в docker compose
tags:
  - name: health
  - name: setup
    description: "Мастер первичной настройки (ТЗ 12.2, экран 1)"
  - name: settings
    description: "Настройки и справочники (экран 5)"
  - name: sim
    description: "Управление симуляцией и запусками эмуляции (ТЗ 4, 4.6)"
  - name: scenarios
    description: "Демо-сценарии (ТЗ 18)"
  - name: signals
    description: "Сигналы клиентов (ТЗ 6–7)"
  - name: incidents
    description: "Инциденты (ТЗ 8)"
  - name: hitl
    description: "Human-in-the-loop (ТЗ 10)"
  - name: tasks
    description: "Подарки и задачи (ТЗ 8.5)"
  - name: clients
    description: "Клиент 360"
  - name: map
    description: "Тепловая карта РФ"
  - name: metrics
    description: "Дашборд, экономика dCLTV, калькулятор «Факт» (ТЗ 14)"
  - name: engine
    description: "«Под капотом»: трассировка, графы, БД (ТЗ 12.2 экран 4, 12.5)"
  - name: bench
    description: "Бенчмарки LLM (ТЗ 14.3)"
  - name: public
    description: "Лендинг, трекинг, Telegram-бот, эмулятор внешней площадки (ТЗ 11, 21.2)"
  - name: feed
    description: "Внешние площадки: посты, публичные ответы, статистика (ТЗ 21)"
  - name: abs
    description: "Mock-АБС: счета, проводки, возвраты (ТЗ 3.4, 21.4)"
  - name: rules
    description: "Детерминированные бизнес-правила (ТЗ 9.6)"
  - name: compliance
    description: "Аудиомониторинг отделения и мисселлинг (ТЗ 22)"
  - name: stt
    description: "Провайдеры распознавания речи (ТЗ 5.3)"
  - name: demo
    description: "Меню демонстратора, режим подстраховки, кассеты replay (ТЗ 5.4, 12.7)"
  - name: ingest
    description: "[ДТЗ] Приёмный слой: единая схема сообщения, транскрипты JSON/TXT, адаптеры REST/polling (ТЗ 3.7)"
  - name: tickets
    description: "[ДТЗ] Тикетница — представление v_tickets над инцидентами (ТЗ 9.7)"
  - name: escalations
    description: "[ДТЗ] Эскалации руководителю (ТЗ 9.7)"
  - name: search
    description: "[АРХ] Универсальный поиск по идентификаторам и тексту (ТЗ 28.2)"
  - name: trace
    description: "[АРХ] След объекта: до / объект / после (ТЗ 28.3)"
  - name: journey
    description: "[АРХ] Путь обращения, 8 стадий (ТЗ 27)"
  - name: cabinet
    description: "[ЕТЗ] Кабинет менеджера продукта (ТЗ 24)"
  - name: csi
    description: "[ЕТЗ] Аналитика CSI (ТЗ 25)"
  - name: branches
    description: "[ЕТЗ] Справочник и динамика сети ВСП (ТЗ 25.3)"

paths:
  /api/demo/execution:
    get:
      tags:
      - demo
      summary: Текущий изолированный demo-запуск
      responses:
        '200':
          description: Состояние demo-исполнения
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DemoExecutionState'
    post:
      tags:
      - demo
      summary: Запуск эмуляции сотрудников и команд
      responses:
        '202':
          description: Состояние demo-исполнения
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DemoExecutionState'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DemoExecutionRequest'
    delete:
      tags:
      - demo
      summary: Остановка demo-исполнения с сохранением истории
      responses:
        '200':
          description: Состояние demo-исполнения
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DemoExecutionState'
  /api/demo/incidents/{id}/recover:
    post:
      tags: [demo]
      summary: Продолжить неудачную demo-попытку в том же инциденте
      parameters:
      - name: id
        in: path
        required: true
        schema: {type: integer, minimum: 1}
      responses:
        '202':
          description: Продолжение зарегистрировано; повтор идемпотентен
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DemoExecutionState'}
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
  /api/health:
    get:
      tags: [health]
      summary: Проверка готовности (db, llm, tgbot, sim)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [status, db, setup_completed]
                properties:
                  status: { type: string, enum: [ok, degraded] }
                  db: { type: boolean }
                  setup_completed: { type: boolean }
                  llm: { type: object, additionalProperties: { type: string, enum: [ok, error, disabled] } }
                  tgbot: { type: string, enum: [running, disabled, error] }
                  sim_running: { type: boolean }
                  version: { type: string }

  # ---------------------------------------------------------------- setup
  /api/setup/status:
    get:
      tags: [setup]
      summary: Состояние мастера
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  completed: { type: boolean }
                  current_step: { type: integer, minimum: 1, maximum: 9 }
                  steps_done: { type: array, items: { type: integer } }
  /api/setup:
    put:
      tags: [setup]
      summary: Сохранить шаг(и) мастера
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SetupPayload" }
      responses:
        "200": { description: Сохранено, content: { application/json: { schema: { $ref: "#/components/schemas/SetupPayload" } } } }
        "422": { $ref: "#/components/responses/Problem" }
    post:
      tags: [setup]
      summary: Завершить мастер («Готово»)
      responses:
        "204": { description: "Мастер завершён, редирект на рабочее место" }
  /api/setup/test-llm:
    post:
      tags: [setup]
      summary: Проверить подключение к LLM-профилю (кнопка «Проверить подключение»)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [provider, model]
              properties:
                provider: { $ref: "#/components/schemas/LlmProvider" }
                model: { type: string }
                base_url: { type: string, format: uri }
                api_key: { type: string, description: "Передаётся один раз, хранится зашифрованно" }
                api_key_id: { type: integer, description: Либо ссылка на уже сохранённый ключ }
      responses:
        "200":
          description: Результат
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  latency_ms: { type: integer }
                  model_reported: { type: string }
                  supports_tools: { type: boolean }
                  supports_stream: { type: boolean }
                  quota: { type: object, description: "Остаток лимитов (OpenRouter GET /api/v1/key, токены GigaChat)" }
                  error: { type: string }
  /api/setup/test-tgbot:
    post:
      tags: [setup]
      summary: Проверить токен Telegram-бота (getMe)
      requestBody:
        content: { application/json: { schema: { type: object, properties: { token: { type: [string, "null"], description: "Пусто — берётся TELEGRAM_BOT_TOKEN из .env" } } } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object, properties: { ok: { type: boolean }, username: { type: string }, error: { type: string } } } } } }
  /api/setup/generate:
    post:
      tags: [setup]
      summary: Запустить генерацию синтетических данных (профиль lite/demo/stress)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                profile: { type: string, enum: [lite, demo, stress], default: demo }
                seed: { type: integer }
                reset: { type: boolean, default: false }
                regions_mode: { type: string, enum: [all, cfo_szfo, custom] }
                region_codes: { type: array, items: { type: string } }
      responses:
        "202": { description: Принято, content: { application/json: { schema: { type: object, properties: { job_id: { type: string } } } } } }
    get:
      tags: [setup]
      summary: Прогресс генерации и матрица покрытия
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  job_id: { type: string }
                  status: { type: string, enum: [idle, running, done, failed] }
                  progress: { type: number, minimum: 0, maximum: 1 }
                  log: { type: array, items: { type: string } }
                  coverage: { $ref: "#/components/schemas/CoverageMatrix" }

  # ---------------------------------------------------------------- settings
  /api/settings:
    get:
      tags: [settings]
      summary: Все настройки (ключ → значение)
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object, additionalProperties: true } } } }
    patch:
      tags: [settings]
      summary: Изменить настройки (частично)
      requestBody: { required: true, content: { application/json: { schema: { type: object, additionalProperties: true } } } }
      responses:
        "200": { description: OK }
  /api/settings/env:
    get:
      tags: [settings]
      summary: Переменные .env (секреты маскируются), путь файла
      description: Мастер настройки редактирует .env как интерфейс к конфигурации процесса; в Docker файл смонтирован в /data/env/.env (ENV_FILE).
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  path: { type: string }
                  exists: { type: boolean }
                  writable: { type: boolean }
                  items: { type: array, items: { $ref: "#/components/schemas/EnvVar" } }
    put:
      tags: [settings]
      summary: Записать переменные в .env и применить без перезапуска (LLM, каналы, STT)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EnvUpdate" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnvResult" }
        "422": { $ref: "#/components/responses/Problem" }
  /api/settings/export:
    get:
      tags: [settings]
      summary: Экспорт конфигурации (JSON) — настройки, SLA, маршрутизация, шаблоны, профили LLM без ключей
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object } } } }
  /api/settings/import:
    post:
      tags: [settings]
      summary: Импорт конфигурации
      requestBody: { required: true, content: { application/json: { schema: { type: object } } } }
      responses:
        "200": { description: Импортировано }
        "422": { $ref: "#/components/responses/Problem" }
  /api/settings/sla-matrix:
    get:
      tags: [settings]
      summary: Матрица SLA
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/SlaCell" } } } } }
    put:
      tags: [settings]
      summary: Заменить матрицу SLA (9 ячеек)
      requestBody: { required: true, content: { application/json: { schema: { type: array, minItems: 9, maxItems: 9, items: { $ref: "#/components/schemas/SlaCell" } } } } }
      responses:
        "200": { description: OK }
  /api/settings/routing-rules:
    get:
      tags: [settings]
      summary: Правила маршрутизации
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/RoutingRule" } } } } }
    put:
      tags: [settings]
      summary: Заменить правила
      requestBody: { required: true, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/RoutingRule" } } } } }
      responses:
        "200": { description: OK }
  /api/settings/llm-profiles:
    get:
      tags: [settings]
      summary: Профили LLM
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/LlmProfile" } } } } }
    post:
      tags: [settings]
      summary: Добавить профиль
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/LlmProfile" } } } }
      responses:
        "201": { description: Создан }
  /api/settings/llm-profiles/{id}:
    parameters: [{ $ref: "#/components/parameters/IdPath" }]
    patch:
      tags: [settings]
      summary: Изменить профиль (в т. ч. роль main/fast/twin, активность)
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/LlmProfile" } } } }
      responses:
        "200": { description: OK }
    delete:
      tags: [settings]
      summary: Удалить профиль
      responses:
        "204": { description: Удалён }
  /api/settings/llm-keys:
    get:
      tags: [settings]
      summary: Ключи LLM (без значения ключа) с остатками токенов/лимитов
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/LlmApiKey" } } } } }
    post:
      tags: [settings]
      summary: Добавить ключ
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [provider, label, key]
              properties:
                provider: { $ref: "#/components/schemas/LlmProvider" }
                label: { type: string }
                key: { type: string, writeOnly: true }
                tokens_limit: { type: integer }
      responses:
        "201": { description: Создан, content: { application/json: { schema: { $ref: "#/components/schemas/LlmApiKey" } } } }
  /api/settings/llm-keys/{id}:
    parameters: [{ $ref: "#/components/parameters/IdPath" }]
    delete:
      tags: [settings]
      summary: Удалить ключ
      responses:
        "204": { description: Удалён }
  /api/settings/templates:
    get:
      tags: [settings]
      summary: Шаблоны уведомлений
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/NotificationTemplate" } } } } }
    put:
      tags: [settings]
      summary: Заменить набор шаблонов
      requestBody: { required: true, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/NotificationTemplate" } } } } }
      responses:
        "200": { description: OK }
  /api/settings/gifts:
    get:
      tags: [settings]
      summary: Справочник подарков
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/GiftCatalogItem" } } } } }
    put:
      tags: [settings]
      summary: Заменить справочник подарков
      requestBody: { required: true, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/GiftCatalogItem" } } } } }
      responses:
        "200": { description: OK }
  /api/settings/economics:
    get:
      tags: [settings]
      summary: Параметры экономики и таблица ставок dCLTV
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/EconomicsSettings" } } } }
    put:
      tags: [settings]
      summary: Изменить параметры экономики/ставки
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/EconomicsSettings" } } } }
      responses:
        "200": { description: OK }
  /api/settings/psychotypes:
    get:
      tags: [settings]
      summary: Психотипы и доли по сегментам (ТЗ 4.5)
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/PsychotypeSettings" } } } }
    put:
      tags: [settings]
      summary: Изменить параметры психотипов и доли
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/PsychotypeSettings" } } } }
      responses:
        "200": { description: OK }
        "422": { $ref: "#/components/responses/Problem", description: Сумма долей по сегменту ≠ 1 }
  /api/refs/{name}:
    get:
      tags: [settings]
      summary: Справочник по имени (regions, cities, segments, products, systems, teams, channels, error_codes, signal_types)
      parameters:
        - { name: name, in: path, required: true, schema: { type: string, enum: [regions, cities, segments, products, systems, teams, channels, error_codes, signal_types, federal_districts] } }
        - { name: region_code, in: query, schema: { type: string }, description: Для cities }
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { type: object, additionalProperties: true } } } } }

  # ---------------------------------------------------------------- sim
  /api/sim/state:
    get:
      tags: [sim]
      summary: Текущее состояние симуляции
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/SimState" } } } }
  /api/sim/control:
    post:
      tags: [sim]
      summary: "Старт/Пауза/Возобновить/Стоп/Шаг/Сброс дня/Скорость"
      description: |
        ТЗ 4.6. `start` — создаёт новый запуск kind=free (если текущего нет или он завершён) либо продолжает paused;
        `pause` — замораживает время (статус paused); `resume` — возобновляет paused/interrupted с того же sim_time;
        `stop` — завершает текущий запуск (считает summary, статус stopped). Для нового запуска с другим режимом сброса — POST /api/sim/runs.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action: { type: string, enum: [start, pause, resume, stop, step, reset_day, set_speed, set_preset, jump_to] }
                label: { type: string, description: "Метка нового запуска (для start)" }
                speed: { type: number, description: сим-секунд на реальную секунду (для set_speed) }
                preset: { type: string, enum: [demo_5min, day_12min, realtime] }
                step_minutes: { type: integer, default: 15 }
                sim_time: { type: string, format: date-time, description: Для jump_to (только вперёд) }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/SimState" } } } }
  /api/sim/events:
    get:
      tags: [sim]
      summary: Лента событий симулятора (шина событий)
      parameters:
        - { $ref: "#/components/parameters/RunId" }
        - { name: type, in: query, schema: { type: string }, description: "Префикс, напр. fault. или client." }
        - { name: since_sim, in: query, schema: { type: string, format: date-time } }
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Cursor" }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/SimEventList" } } } }

  /api/sim/runs:
    get:
      tags: [sim]
      summary: "История запусков эмуляции (ТЗ 4.6)"
      parameters:
        - { name: status, in: query, schema: { type: array, items: { type: string, enum: [running, paused, interrupted, completed, stopped, archived] } }, style: form, explode: false }
        - { name: kind, in: query, schema: { type: string, enum: [baseline, free, scenario] } }
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Cursor" }
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: "#/components/schemas/SimRun" } }, next_cursor: { type: [string, "null"] } } } } } }
    post:
      tags: [sim]
      summary: "Создать и стартовать новый запуск (свободный или сценарный) с выбранным режимом сброса"
      description: |
        `reset_mode`: `none` — продолжить поверх текущих данных (новый run_id, счётчики чистые);
        `counters` — то же, но текущий запуск принудительно завершается со статусом stopped;
        `baseline` — полный откат к снимку базового состояния (pg_restore) и старт с чистого листа; обязателен для сценариев с именованными клиентами (1, 4, 7).
        Если есть незавершённый запуск (running/paused/interrupted) и reset_mode = none — 409.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind]
              properties:
                kind: { type: string, enum: [free, scenario] }
                scenario_id: { type: string }
                label: { type: string }
                seed: { type: integer, description: "По умолчанию — сид базового состояния" }
                reset_mode: { type: string, enum: [none, counters, baseline], default: counters }
                speed_preset: { type: string, enum: [demo_5min, day_12min, realtime] }
                llm_profile_id: { type: integer }
      responses:
        "202": { description: Запуск создан и стартован, content: { application/json: { schema: { $ref: "#/components/schemas/SimRun" } } } }
        "409": { $ref: "#/components/responses/Problem" }
  /api/sim/runs/current:
    get:
      tags: [sim]
      summary: "Текущий запуск с живыми счётчиками (v_run_counters)"
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/SimRun" } } } }
        "404": { $ref: "#/components/responses/Problem" }
  /api/sim/runs/{id}:
    parameters: [{ $ref: "#/components/parameters/IdPath" }]
    get:
      tags: [sim]
      summary: "Запуск: параметры, счётчики, итоговые метрики"
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/SimRun" } } } }
    delete:
      tags: [sim]
      summary: "Удалить запуск вместе с данными (нельзя для baseline и текущего)"
      responses:
        "204": { description: Удалён }
        "409": { $ref: "#/components/responses/Problem" }
  /api/sim/runs/{id}/stop:
    parameters: [{ $ref: "#/components/parameters/IdPath" }]
    post:
      tags: [sim]
      summary: "Завершить запуск (рассчитать summary, статус stopped)"
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/SimRun" } } } }
  /api/sim/runs/{id}/resume:
    parameters: [{ $ref: "#/components/parameters/IdPath" }]
    post:
      tags: [sim]
      summary: "Возобновить прерванный/приостановленный запуск с того же sim_time"
      description: "Допустим только для последнего запуска в статусе paused/interrupted; восстанавливает агентов из чекпоинтов, пересчитывает followups."
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/SimRun" } } } }
        "409": { $ref: "#/components/responses/Problem" }
  /api/sim/runs/{id}/archive:
    parameters: [{ $ref: "#/components/parameters/IdPath" }]
    post:
      tags: [sim]
      summary: "Архивировать — экспорт в runs/<id>.json и удаление строк данных, summary сохраняется"
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/SimRun" } } } }
  /api/sim/runs/{id}/export:
    parameters: [{ $ref: "#/components/parameters/IdPath" }]
    get:
      tags: [sim]
      summary: "Экспорт запуска (JSON с summary и агрегатами или CSV событий)"
      parameters: [{ name: format, in: query, schema: { type: string, enum: [json, csv], default: json } }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object, additionalProperties: true } }, text/csv: { schema: { type: string } } } }
  /api/sim/runs/compare:
    get:
      tags: [sim]
      summary: "Сравнение двух запусков по метрикам 14.1/14.4 и расходу токенов"
      parameters:
        - { name: a, in: query, required: true, schema: { type: integer, format: int64 } }
        - { name: b, in: query, required: true, schema: { type: integer, format: int64 } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object, properties: { a: { $ref: "#/components/schemas/SimRun" }, b: { $ref: "#/components/schemas/SimRun" }, diff: { type: object, additionalProperties: { type: number } } } } } } }
  /api/sim/baseline:
    get:
      tags: [sim]
      summary: "Состояние снимка базового состояния (путь, профиль, размер, контрольная сумма, дата)"
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/BaselineInfo" } } } }
    post:
      tags: [sim]
      summary: "Пересоздать снимок baseline из текущего базового состояния (только когда нет активного запуска)"
      responses:
        "202": { description: Принято }
        "409": { $ref: "#/components/responses/Problem" }
  /api/sim/baseline/restore:
    post:
      tags: [sim]
      summary: "Откат к снимку baseline без старта нового запуска (режим обслуживания, ≤ 60 с для demo)"
      responses:
        "202": { description: Принято, content: { application/json: { schema: { type: object, properties: { job_id: { type: string } } } } } }
        "409": { $ref: "#/components/responses/Problem" }

  # ---------------------------------------------------------------- scenarios
  /api/scenarios:
    get:
      tags: [scenarios]
      summary: Список демо-сценариев
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Scenario" } } } } }
  /api/scenarios/{id}/run:
    parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
    post:
      tags: [scenarios]
      summary: "Запустить сценарий как отдельный запуск эмуляции (ТЗ 4.6, 18)"
      description: "Эквивалент POST /api/sim/runs с kind=scenario. Сценарии с именованными клиентами (1, 4, 7) требуют reset_mode=baseline, иначе 409."
      requestBody:
        content: { application/json: { schema: { type: object, properties: { speed_preset: { type: string, enum: [demo_5min, day_12min, realtime] }, reset_mode: { type: string, enum: [none, counters, baseline], default: counters }, label: { type: string } } } } }
      responses:
        "202": { description: Запущен, content: { application/json: { schema: { type: object, properties: { run: { $ref: "#/components/schemas/SimRun" }, client_id: { type: integer } } } } } }
        "409": { $ref: "#/components/responses/Problem" }

  # ---------------------------------------------------------------- signals
  /api/signals:
    get:
      tags: [signals]
      summary: Лента сигналов с фильтрами
      parameters:
        - { $ref: "#/components/parameters/RunId" }
        - { name: q, in: query, schema: { type: string, maxLength: 200 }, description: "Текст или код сущности, включая связанные SIG/INC. Все статусы доступны без status-фильтра; run_id=all ищет во всех запусках." }
        - { name: tag, in: query, schema: { type: string, maxLength: 100 }, description: "Тег источника, например ui_pers_demo" }
        - { name: channel, in: query, schema: { type: array, items: { type: string } }, style: form, explode: true }
        - { name: signal_type, in: query, schema: { type: array, items: { type: string } }, style: form, explode: true }
        - { name: status, in: query, schema: { type: array, items: { type: string } }, style: form, explode: true }
        - { name: segment, in: query, schema: { type: array, items: { type: string } }, style: form, explode: true }
        - { name: product, in: query, schema: { type: array, items: { type: string } }, style: form, explode: true }
        - { name: region_code, in: query, schema: { type: string } }
        - { name: city_id, in: query, schema: { type: integer } }
        - { name: criticality, in: query, schema: { type: string, enum: [low, medium, high] } }
        - { name: since_sim, in: query, schema: { type: string, format: date-time } }
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Cursor" }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/SignalList" } } } }
    post:
      tags: [signals]
      summary: Жюри-режим — ввести сообщение клиента вручную
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [channel_code, text]
              properties:
                channel_code: { type: string }
                channel_subtype: { type: string }
                client_id: { type: [integer, "null"], description: null = неизвестный клиент }
                external_contact: { $ref: "#/components/schemas/ExternalContact" }
                text: { type: string, minLength: 3, maxLength: 5000 }
                compare_with_mock: { type: boolean, default: true, description: Параллельный прогон через mock для панели «ИИ против правил» }
                voice_meta: { anyOf: [{ $ref: "#/components/schemas/VoiceMeta" }, { type: "null" }], description: "Заполняется при вводе через «Надиктовать» (ТЗ 12.2 экран 7); origin сигнала = voice_input" }
      responses:
        "202":
          description: Принят в обработку
          content:
            application/json:
              schema:
                type: object
                properties:
                  signal_id: { type: integer }
                  agent_run_id: { type: integer }
                  compare_run_id: { type: [integer, "null"] }
        "429": { $ref: "#/components/responses/Problem", description: "Общий лимит жюри: не более 20 запросов в минуту; Retry-After содержит задержку в секундах" }
  /api/signals/{id}:
    parameters: [{ $ref: "#/components/parameters/IdPath" }]
    get:
      tags: [signals]
      summary: Сигнал с классификацией, решением, связанными инцидентами и запусками агента
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/SignalDetail" } } } }
        "404": { $ref: "#/components/responses/Problem" }
  /api/signals/deferred:
    get:
      tags: [signals]
      summary: Отложенные («спящие») обращения с причиной и временем пробуждения
      parameters: [{ $ref: "#/components/parameters/Limit" }, { $ref: "#/components/parameters/Cursor" }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/DeferredList" } } } }

  # ---------------------------------------------------------------- incidents
  /api/incidents:
    get:
      tags: [incidents]
      summary: Инциденты (доска/таблица)
      parameters:
        - { $ref: "#/components/parameters/RunId" }
        - { name: status, in: query, schema: { type: array, items: { type: string } }, style: form, explode: false }
        - { name: team, in: query, schema: { type: string } }
        - { name: product, in: query, schema: { type: string } }
        - { name: criticality, in: query, schema: { type: string } }
        - { name: complexity, in: query, schema: { type: string } }
        - { name: incident_type, in: query, schema: { type: string } }
        - { name: region_code, in: query, schema: { type: string } }
        - { name: sla_risk, in: query, schema: { type: string, enum: [any, warning, breached] } }
        - { name: routing_status, in: query, schema: { $ref: "#/components/schemas/RoutingStatus" }, description: "[ДТЗ]" }
        - { name: sentiment, in: query, schema: { $ref: "#/components/schemas/Sentiment" }, description: "[ДТЗ]" }
        - { name: sort, in: query, schema: { type: string, enum: [priority, sla_due, created, updated], default: priority } }
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Cursor" }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/IncidentList" } } } }
  /api/incidents/{id}:
    parameters: [{ $ref: "#/components/parameters/IdPath" }]
    get:
      tags: [incidents]
      summary: Карточка инцидента (сводка + клиент 360 + SLA + экономика)
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/IncidentDetail" } } } }
        "404": { $ref: "#/components/responses/Problem" }
  /api/incidents/{id}/history:
    parameters: [{ $ref: "#/components/parameters/IdPath" }]
    get:
      tags: [incidents]
      summary: История статусов
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/StatusHistoryItem" } } } } }
  /api/incidents/{id}/artifacts:
    parameters: [{ $ref: "#/components/parameters/IdPath" }]
    get:
      tags: [incidents]
      summary: Документы команды (RCA, решение о фиксе, промежуточные отчёты, релиз, проверка)
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Artifact" } } } } }
  /api/incidents/{id}/signals:
    parameters: [{ $ref: "#/components/parameters/IdPath" }]
    get:
      tags: [incidents]
      summary: Связанные сигналы и логи систем
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  signals: { type: array, items: { $ref: "#/components/schemas/Signal" } }
                  system_logs: { type: array, items: { $ref: "#/components/schemas/SystemLog" } }
  /api/incidents/{id}/communications:
    parameters: [{ $ref: "#/components/parameters/IdPath" }]
    get:
      tags: [incidents]
      summary: Коммуникации с клиентом и реакции двойника
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  notifications: { type: array, items: { $ref: "#/components/schemas/Notification" } }
                  reactions: { type: array, items: { $ref: "#/components/schemas/ClientReaction" } }
  /api/incidents/{id}/economics:
    parameters: [{ $ref: "#/components/parameters/IdPath" }]
    get:
      tags: [incidents]
      summary: Развёрнутый расчёт dCLTV по инциденту (все множители)
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/IncidentEconomics" } } } }
  /api/incidents/{id}/actions:
    parameters: [{ $ref: "#/components/parameters/IdPath" }]
    post:
      tags: [incidents]
      summary: Действие сотрудника CX над инцидентом
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action: { type: string, enum: [take, reroute, reply_client, close, request_client_data, escalate, reject, mark_duplicate, change_priority], description: "take — взять в работу (new/classified/routed → in_progress)" }
                team_code: { type: string }
                text: { type: string }
                channel_code: { type: string }
                duplicate_of_id: { type: integer }
                priority: { type: integer, minimum: 1, maximum: 4 }
                reason: { type: string }
                actor: { type: string, description: "Кто выполнил действие (логин/роль), пишется в incident_status_history.actor_ref" }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/IncidentDetail" } } } }
        "409": { $ref: "#/components/responses/Problem", description: Недопустимый переход статуса }
  /api/teams/load:
    get:
      tags: [incidents]
      summary: Нагрузка команд и соблюдение SLA (вкладка «Команды»)
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/TeamLoad" } } } } }

  # ---------------------------------------------------------------- hitl
  /api/hitl/queue:
    get:
      tags: [hitl]
      summary: Очередь «Требует решения»
      parameters:
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Cursor" }
        - { name: run_id, in: query, schema: { type: string, default: all }, description: "all / current / id; default all сохраняет доступ к прошлым запросам" }
        - { name: q, in: query, schema: { type: string, maxLength: 200 }, description: "Текст или код любой сущности реестра. Поиск включает уже решённые запросы и связанные SIG/INC." }
        - { name: include_decided, in: query, schema: { type: boolean, default: false }, description: "Без поиска показываются открытые и автоматически продолженные запросы; true добавляет обработанные человеком." }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/HitlList" } } } }
  /api/hitl/{id}:
    parameters: [{ $ref: "#/components/parameters/IdPath" }]
    get:
      tags: [hitl]
      summary: Карточка HITL (сигнал, контекст, предложение агента, варианты)
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/HitlItem" } } } }
    post:
      tags: [hitl]
      summary: Решение или подтверждение запроса; продолжение только для активного wait_human
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision: { type: string, enum: [accept, modify, reject, delegate] }
                modified_proposal: { $ref: "../events/agent/decision.schema.json" }
                comment: { type: string }
                delegate_to: { type: string, description: роль или команда }
                use_as_fewshot: { type: boolean, default: true }
      responses:
        "200": { description: "Принято; граф продолжен только для активного wait_human", content: { application/json: { schema: { $ref: "#/components/schemas/HitlItem" } } } }
        "409": { $ref: "#/components/responses/Problem", description: Уже решено }

  /api/hitl/{id}/feedback:
    parameters: [{ $ref: "#/components/parameters/IdPath" }]
    get:
      tags: [hitl]
      summary: История информации оператора, доступная после продолжения процесса
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
        - { $ref: "#/components/parameters/Cursor" }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/HitlFeedbackList" } } } }
        "404": { $ref: "#/components/responses/Problem" }
    post:
      tags: [hitl]
      summary: Сохранить дополнительную информацию без повторного выполнения графа или денег
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [comment, idempotency_key]
              properties:
                comment: { type: string, minLength: 1, maxLength: 4000 }
                recorded_by: { type: string, minLength: 1, maxLength: 120, default: operator }
                idempotency_key: { type: string, minLength: 1, maxLength: 120 }
      responses:
        "201": { description: "Запись сохранена; точный повтор ключа возвращает ту же запись", content: { application/json: { schema: { $ref: "#/components/schemas/HitlFeedback" } } } }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }

  # ---------------------------------------------------------------- tasks
  /api/tasks:
    get:
      tags: [tasks]
      summary: Задачи (подарки, звонки, ручные проверки, напоминания об отчётах)
      parameters:
        - { name: kind, in: query, schema: { type: string, enum: [gift, callback, manual_review, clarify_client, report_reminder, closure_review] } }
        - { name: status, in: query, style: form, explode: true, schema: { type: array, items: { type: string, enum: [open, approved, changed, rejected, done, cancelled] } } }
        - { name: requires_hitl, in: query, schema: { type: boolean } }
        - { name: ready, in: query, schema: { type: boolean }, description: "true — только готовые к выполнению: инцидент решён (when = after_resolved) или when = now" }
        - { $ref: "#/components/parameters/RunId" }
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Cursor" }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/TaskList" } } } }
  /api/tasks/{id}:
    parameters: [{ $ref: "#/components/parameters/IdPath" }]
    post:
      tags: [tasks]
      summary: Подтвердить / изменить / отклонить задачу (например, заменить привилегию в подарке)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action: { type: string, enum: [approve, change, reject, done] }
                payload: { type: object, additionalProperties: true, description: Для change — новый gift_code/points/privilege_code }
                comment: { type: string }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Task" } } } }

  # ---------------------------------------------------------------- clients
  /api/clients:
    get:
      tags: [clients]
      summary: Поиск клиента (для жюри-режима и фильтров)
      parameters:
        - { name: q, in: query, schema: { type: string } }
        - { name: segment, in: query, schema: { type: string } }
        - { name: region_code, in: query, schema: { type: string } }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/ClientBrief" } } } } }
  /api/clients/{id}/360:
    parameters: [{ $ref: "#/components/parameters/IdPath" }]
    get:
      tags: [clients]
      summary: Клиент 360 — профиль, продукты, операции, сигналы, инциденты, состояние и стиль коммуникации
      parameters:
        - { $ref: "#/components/parameters/RunId" }
        - { name: ops_hours, in: query, schema: { type: integer, default: 72 } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Client360" } } } }

  # ---------------------------------------------------------------- map
  /api/map/heat:
    get:
      tags: [map]
      summary: Агрегаты по субъектам РФ для тепловой карты
      parameters:
        - { name: layer, in: query, schema: { type: string, enum: [signals, critical, incidents_open, churn_risk], default: signals } }
        - { name: window_hours, in: query, schema: { type: integer, default: 24 } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/RegionHeat" } } } } }
  /api/map/regions/{code}/cities:
    parameters: [{ name: code, in: path, required: true, schema: { type: string } }]
    get:
      tags: [map]
      summary: Drill-down субъект → города
      parameters: [{ name: window_hours, in: query, schema: { type: integer, default: 24 } }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/CityHeat" } } } } }

  # ---------------------------------------------------------------- metrics
  /api/metrics/dashboard:
    get:
      tags: [metrics]
      summary: "KPI рабочего места (ТЗ 14.1) — по умолчанию в рамках текущего запуска"
      parameters:
        - { $ref: "#/components/parameters/RunId" }
        - { name: window, in: query, schema: { type: string, enum: [today, 7d, 14d, run], default: run } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/DashboardMetrics" } } } }
  /api/metrics/economics/preview:
    get:
      tags: [metrics]
      summary: Калькулятор потерь без записи в БД
      parameters:
        - { name: affected, in: query, schema: { type: integer, default: 12, minimum: 0, maximum: 100000000 } }
        - { name: product, in: query, schema: { type: string } }
        - { name: system, in: query, schema: { type: string } }
        - { name: segment, in: query, schema: { type: string } }
        - { name: detractor_share, in: query, schema: { type: number, default: 0.1, minimum: 0, maximum: 1 } }
        - { name: no_return_share, in: query, schema: { type: number, default: 0.5, minimum: 0, maximum: 1 } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/IncidentEconomics" } } } }

  /api/metrics/economics:
    get:
      tags: [metrics]
      summary: Экономика dCLTV — потенциальные, предотвращённые, под риском, реализованные (ТЗ 14.4)
      parameters:
        - { $ref: "#/components/parameters/RunId" }
        - { name: window, in: query, schema: { type: string, enum: [today, 7d, 14d], default: 14d } }
        - { name: group_by, in: query, schema: { type: string, enum: [product, region, segment, team, outcome], default: product } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/EconomicsSummary" } } } }
  /api/metrics/economics/fact:
    get:
      tags: [metrics]
      summary: "Калькулятор «Факт по симуляции» (ТЗ 14.5) — по умолчанию текущий запуск"
      parameters:
        - { name: product, in: query, schema: { type: string } }
        - { name: system, in: query, schema: { type: string } }
        - { name: region_code, in: query, schema: { type: string } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/EconomicsFact" } } } }
  /api/metrics/economics/fact/export:
    get:
      tags: [metrics]
      summary: Экспорт факта (CSV/XLSX)
      parameters: [{ name: format, in: query, schema: { type: string, enum: [csv, xlsx], default: csv } }]
      responses:
        "200": { description: Файл, content: { text/csv: { schema: { type: string } }, application/vnd.openxmlformats-officedocument.spreadsheetml.sheet: { schema: { type: string, format: binary } } } }
  /api/metrics/economics/calibrate:
    post:
      tags: [metrics]
      summary: «Подставить факт в калькулятор» — переключить calibration_mode
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [mode], properties: { mode: { type: string, enum: [manual, simulated] } } } } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/EconomicsSettings" } } } }
  /api/notifications:
    get:
      tags: [metrics]
      summary: Центр уведомлений (все исходящие сообщения)
      parameters:
        - { name: recipient_type, in: query, schema: { type: string, enum: [client, team, public, cx] } }
        - { name: client_id, in: query, schema: { type: integer } }
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Cursor" }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/NotificationList" } } } }

  # ---------------------------------------------------------------- engine
  /api/agent/runs:
    get:
      tags: [engine]
      summary: Запуски агента (живая трассировка)
      parameters:
        - { name: q, in: query, description: "Код SIG/INC или связанной сущности; фильтрация до пагинации", schema: { type: string, maxLength: 200 } }
        - { $ref: "#/components/parameters/RunId" }
        - { name: kind, in: query, schema: { type: string, enum: [agent, client_twin, team_emulator, bench, compare] } }
        - { name: signal_id, in: query, schema: { type: integer } }
        - { name: outcome, in: query, schema: { type: string } }
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Cursor" }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/AgentRunList" } } } }
  /api/agent/runs/{id}:
    parameters: [{ $ref: "#/components/parameters/IdPath" }]
    get:
      tags: [engine]
      summary: Запуск с деревом шагов (промпты, ответы, инструменты, токены, латентность)
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/AgentRunDetail" } } } }
  /api/agent/graph:
    get:
      tags: [engine]
      summary: Схема графа LangGraph (узлы, рёбра) для подсветки текущего узла
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/AgentGraph" } } } }
  /api/agent/compare:
    post:
      tags: [engine]
      summary: Панель «ИИ против правил» — один текст через LLM-профиль и mock параллельно
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text, channel_code]
              properties:
                text: { type: string, minLength: 3, maxLength: 5000 }
                channel_code: { type: string }
                client_id: { type: [integer, "null"] }
                llm_profile_id: { type: integer }
      responses:
        "200":
          description: Оба результата с объяснением различий
          content:
            application/json:
              schema:
                type: object
                properties:
                  llm: { $ref: "../events/agent/classification.schema.json" }
                  mock: { $ref: "../events/agent/classification.schema.json" }
                  diff: { type: array, items: { type: object, properties: { field: { type: string }, llm: {}, mock: {} } } }
                  llm_run_id: { type: integer }
                  mock_run_id: { type: integer }
        "429": { $ref: "#/components/responses/Problem", description: "Общий лимит жюри: не более 20 запросов в минуту; Retry-After содержит задержку в секундах" }
  /api/engine/entity-graph:
    get:
      tags: [engine]
      summary: Граф сущностей клиент–сигнал–инцидент–система–команда (React Flow)
      parameters:
        - { name: incident_id, in: query, schema: { type: integer } }
        - { name: client_id, in: query, schema: { type: integer } }
        - { name: depth, in: query, schema: { type: integer, default: 2, maximum: 4 } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/EntityGraph" } } } }
  /api/engine/db/tables:
    get:
      tags: [engine]
      summary: Счётчики строк по таблицам (реальное время)
      parameters: [{ $ref: "#/components/parameters/RunId" }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { type: object, properties: { table: { type: string }, rows: { type: integer }, exact: { type: boolean, description: Точный счётчик; false — оценка pg_stat_user_tables }, last_change_at: { type: [string, "null"], format: date-time } } } } } } }
  /api/engine/db/tables/{name}/rows:
    parameters: [{ name: name, in: path, required: true, schema: { type: string } }]
    get:
      tags: [engine]
      summary: Последние записи таблицы (только чтение, allow-list таблиц)
      parameters: [{ $ref: "#/components/parameters/Limit" }, { $ref: "#/components/parameters/RunId" }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { type: object, additionalProperties: true } } } } }
        "403": { $ref: "#/components/responses/Problem", description: Таблица вне allow-list }
  /api/engine/db/activity:
    get:
      tags: [engine]
      summary: Лента INSERT/UPDATE/DELETE из db_activity_log
      parameters: [{ $ref: "#/components/parameters/Limit" }, { $ref: "#/components/parameters/Cursor" }, { $ref: "#/components/parameters/RunId" }, { name: table, in: query, schema: { type: string }, description: Фильтр имени из allow-list; неизвестное имя — 403 }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/DbActivity" } } } } }

  # ---------------------------------------------------------------- reports (качество, docs/REPORTS.md)
  /api/reports/quality:
    get:
      tags: [engine]
      summary: Отчёт о качестве — что сломалось, что работает не так, что доработать (JSON или Markdown)
      parameters:
        - { $ref: "#/components/parameters/RunId" }
        - { name: format, in: query, schema: { type: string, enum: [json, md], default: json } }
      responses:
        "200":
          description: OK
          content:
            application/json: { schema: { $ref: "#/components/schemas/QualityReport" } }
            text/markdown: { schema: { type: string } }
  /api/reports/http:
    get:
      tags: [engine]
      summary: HTTP-метрики процесса — счётчики по маршрутам (5xx/501/4xx/медленные) и последние ошибки
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/HttpStats" } } } }
  /api/reports/log:
    get:
      tags: [engine]
      summary: Хвост JSONL-журнала приложения (var/log/app.jsonl), warning и выше по умолчанию
      parameters:
        - { $ref: "#/components/parameters/Limit" }
        - { name: level, in: query, schema: { type: string, enum: [debug, info, warning, error], default: warning } }
        - { name: event, in: query, schema: { type: string } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { type: object, additionalProperties: true } } } } }

  # ---------------------------------------------------------------- bench
  /api/bench/datasets:
    get:
      tags: [bench]
      summary: Наборы (golden, lite) с числом кейсов
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { type: object, properties: { id: { type: integer }, code: { type: string }, title_ru: { type: string }, cases: { type: integer } } } } } } }
  /api/bench/runs:
    get:
      tags: [bench]
      summary: Прогоны и сводные метрики (таблица сравнения)
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/BenchRun" } } } } }
    post:
      tags: [bench]
      summary: Запустить прогон (с прогнозом расхода токенов и проверкой лимитов)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [dataset_id, llm_profile_ids]
              properties:
                dataset_id: { type: integer }
                llm_profile_ids: { type: array, items: { type: integer }, minItems: 1 }
                repeats: { type: integer, minimum: 1, maximum: 3, default: 1 }
                dry_run: { type: boolean, default: false, description: Только прогноз расхода }
      responses:
        "202":
          description: Прогоны поставлены в очередь (или прогноз)
          content:
            application/json:
              schema:
                type: object
                properties:
                  run_ids: { type: array, items: { type: integer } }
                  forecast: { type: array, items: { type: object, properties: { llm_profile_id: { type: integer }, est_tokens: { type: integer }, est_requests: { type: integer }, fits_limits: { type: boolean }, warning: { type: string } } } }
  /api/bench/runs/{id}:
    parameters: [{ $ref: "#/components/parameters/IdPath" }]
    get:
      tags: [bench]
      summary: Прогон с результатами по кейсам
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/BenchRunDetail" } } } }
    delete:
      tags: [bench]
      summary: Отменить прогон
      responses:
        "204": { description: Отменён }
  /api/bench/runs/{id}/export:
    parameters: [{ $ref: "#/components/parameters/IdPath" }]
    get:
      tags: [bench]
      summary: Экспорт результатов (CSV/JSON)
      parameters: [{ name: format, in: query, schema: { type: string, enum: [csv, json], default: csv } }]
      responses:
        "200": { description: Файл }

  # ---------------------------------------------------------------- public
  /api/public/claim:
    post:
      tags: [public]
      summary: Лендинг потенциального/неидентифицированного клиента
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [contact, text, consent, captcha]
              properties:
                contact: { $ref: "#/components/schemas/ExternalContact" }
                product_code: { type: string }
                text: { type: string, minLength: 10, maxLength: 4000 }
                consent: { type: boolean, const: true }
                captcha: { type: object, required: [id, answer], properties: { id: { type: string }, answer: { type: integer } } }
                voice_meta: { anyOf: [{ $ref: "#/components/schemas/VoiceMeta" }, { type: "null" }], description: "Кнопка «Надиктовать» на лендинге (ТЗ 11)" }
      responses:
        "201":
          description: Обращение создано
          content:
            application/json:
              schema:
                type: object
                properties:
                  public_id: { type: string, example: SIG-000123 }
                  tracking_token: { type: string }
                  track_url: { type: string, format: uri }
                  qr_svg: { type: string, description: SVG QR-кода ссылки трекинга }
        "422": { $ref: "#/components/responses/Problem" }
  /api/public/captcha:
    get:
      tags: [public]
      summary: Арифметическая антибот-проверка
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object, properties: { id: { type: string }, question: { type: string, example: "7 + 5 = ?" } } } } } }
  /api/public/track/{token}:
    parameters: [{ name: token, in: path, required: true, schema: { type: string, minLength: 24 } }]
    get:
      tags: [public]
      summary: Таймлайн обращения понятным языком
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/TrackingView" } } } }
        "404": { $ref: "#/components/responses/Problem" }
    post:
      tags: [public]
      summary: «Дополнить обращение» (ответ на уточняющий вопрос агента)
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [text], properties: { text: { type: string, maxLength: 4000 } } } } } }
      responses:
        "202": { description: Принято }
  /api/public/bot/qr:
    get:
      tags: [public]
      summary: QR-код на Telegram-бота для жюри-режима и README
      responses:
        "200": { description: SVG, content: { image/svg+xml: { schema: { type: string } } } }
        "404": { $ref: "#/components/responses/Problem", description: Бот выключен }
  /api/internal/tgbot/inbound:
    post:
      tags: [public]
      summary: Внутренний приём сообщений от сервиса tgbot (только из docker-сети)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [chat_id, text, kind]
              properties:
                chat_id: { type: integer }
                username: { type: string }
                kind: { type: string, enum: [start, is_client, not_client, free_text, contact, region, append] }
                text: { type: string }
                payload: { type: object, additionalProperties: true }
      responses:
        "200":
          description: Что ответить пользователю
          content:
            application/json:
              schema:
                type: object
                properties:
                  reply_text: { type: string }
                  buttons: { type: array, items: { type: object, properties: { text: { type: string }, data: { type: string } } } }
                  signal_id: { type: [integer, "null"] }
                  tracking_token: { type: [string, "null"] }


  # ===================== v1.3 — внешние площадки (ТЗ 21) =====================
  /api/public/reviews:
    post:
      tags: [public, feed]
      summary: Публикация отзыва на эмуляторе внешней площадки (BRD FR 1.1)
      description: Создаёт пост, событие `review.posted` и сигнал канала `review_portal`; агент стартует немедленно (быстрый путь при подтверждённом правиле, ТЗ 21.4).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [platform, author_nick, text]
              properties:
                platform: { type: string, enum: [review_portal, telegram_channel] }
                author_nick: { type: string, minLength: 3, maxLength: 32, pattern: "^@?[A-Za-z0-9_\\.]+$" }
                text: { type: string, minLength: 10, maxLength: 4000 }
                mentions:
                  type: object
                  properties:
                    card_last4: { type: [string, "null"], pattern: "^\\d{4}$" }
                    phone_masked: { type: [string, "null"] }
                    city: { type: [string, "null"] }
                compare_with_mock: { type: boolean, default: false }
      responses:
        "202":
          description: Пост принят, агент запущен
          content:
            application/json:
              schema:
                type: object
                properties:
                  post_id: { type: integer }
                  public_id: { type: string, example: POST-000017 }
                  signal_id: { type: integer }
                  agent_run_id: { type: [integer, "null"] }
                  feed_url: { type: string, format: uri }
        "422": { $ref: "#/components/responses/Problem" }
  /api/public/feed:
    get:
      tags: [public, feed]
      summary: Лента эмулятора площадки (без роли)
      parameters:
        - { name: platform, in: query, schema: { type: string, enum: [review_portal, telegram_channel] } }
        - { name: status, in: query, schema: { type: array, items: { type: string } }, style: form, explode: false }
        - $ref: "#/components/parameters/RunId"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: OK
          content: { application/json: { schema: { $ref: "#/components/schemas/ExternalPostList" } } }
  /api/public/feed/{post_id}:
    parameters:
      - { name: post_id, in: path, required: true, schema: { type: integer, format: int64 } }
    get:
      tags: [public, feed]
      summary: Пост с веткой ответов и временем реакции агента
      responses:
        "200":
          description: OK
          content: { application/json: { schema: { $ref: "#/components/schemas/ExternalPostDetail" } } }
        "404": { $ref: "#/components/responses/Problem" }
  /api/feed/{post_id}/reply:
    parameters:
      - { name: post_id, in: path, required: true, schema: { type: integer, format: int64 } }
    post:
      tags: [feed]
      summary: Ручной публичный ответ сотрудника CX (после HITL или вместо агента)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text: { type: string, minLength: 5, maxLength: 1500 }
                incident_id: { type: [integer, "null"] }
      responses:
        "201":
          description: Опубликовано
          content: { application/json: { schema: { $ref: "#/components/schemas/ExternalReply" } } }
  /api/feed/stats:
    get:
      tags: [feed]
      summary: Статистика живого контура (v_feed_latency)
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: OK
          content: { application/json: { schema: { $ref: "#/components/schemas/FeedStats" } } }

  # ===================== v1.3 — Mock-АБС (ТЗ 3.4, 21.4) =====================
  /api/abs/accounts/{client_id}:
    parameters:
      - { name: client_id, in: path, required: true, schema: { type: integer, format: int64 } }
    get:
      tags: [abs]
      summary: Счета клиента и последние проводки (виджет «АБС (эмуляция)»)
      parameters:
        - { name: entries_limit, in: query, schema: { type: integer, default: 20, maximum: 200 } }
      responses:
        "200":
          description: OK
          content: { application/json: { schema: { $ref: "#/components/schemas/AccountsView" } } }
  /api/abs/ledger:
    get:
      tags: [abs]
      summary: Проводки с фильтрами (для экрана «Данные в БД» и проверок)
      parameters:
        - $ref: "#/components/parameters/RunId"
        - { name: client_id, in: query, schema: { type: integer } }
        - { name: operation_id, in: query, schema: { type: integer } }
        - { name: kind, in: query, schema: { type: array, items: { type: string, enum: [debit, credit, fee, refund, reversal] } }, style: form, explode: false }
        - { name: rule_id, in: query, schema: { type: string } }
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: OK
          content: { application/json: { schema: { $ref: "#/components/schemas/LedgerEntryList" } } }
  /api/abs/refunds:
    post:
      tags: [abs, hitl]
      summary: Возврат по решению человека (массовый или сверх лимита автономии)
      description: Служебный вход для HITL; агент выполняет возвраты только инструментом `refund_fee`. Идемпотентен по `correlation_id`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items, reason]
              properties:
                incident_id: { type: [integer, "null"] }
                human_decision_id: { type: [integer, "null"] }
                reason: { type: string, maxLength: 400 }
                items:
                  type: array
                  minItems: 1
                  maxItems: 500
                  items:
                    type: object
                    required: [operation_id, amount_rub, correlation_id]
                    properties:
                      operation_id: { type: integer }
                      amount_rub: { type: number, minimum: 0.01 }
                      rule_id: { type: [string, "null"] }
                      correlation_id: { type: string, format: uuid }
      responses:
        "202":
          description: Возвраты поставлены в очередь; прогресс — в WebSocket `abs`
          content:
            application/json:
              schema:
                type: object
                properties:
                  accepted: { type: integer }
                  skipped_duplicates: { type: integer }
                  job_id: { type: string }

  # ===================== v1.3 — бизнес-правила (ТЗ 9.6) =====================
  /api/rules:
    get:
      tags: [rules]
      summary: Список бизнес-правил
      responses:
        "200":
          description: OK
          content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/BusinessRule" } } } }
    put:
      tags: [rules]
