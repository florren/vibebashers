    get:
      tags:
      - finance
      summary: Эффект одного запуска и сценарные варианты; периоды относительно sim_state.sim_time,
        сутки UTC
      parameters:
      - { name: q, in: query, description: "Код SIG/INC или связанной сущности; фильтрация до пагинации", schema: { type: string, maxLength: 200 } }
      - name: product_mode
        in: query
        description: all — все продукты, включая кейсы без продукта; include — только выбранные (пусто значит ни одного); exclude — все, кроме выбранных (пусто значит все). Дедупликация клиента/сделки выполняется до фильтра.
        schema: { type: string, enum: [all, include, exclude], default: all }
      - name: product_codes
        in: query
        description: Коды из /api/refs/products; неизвестные коды дают 422. Повторяющийся query-параметр.
        style: form
        explode: true
        schema: { type: array, maxItems: 100, items: { type: string } }
      - name: run_id
        in: query
        schema:
          type: string
          default: current
        description: 'Один запуск: current или положительный id. all запрещён. Без текущего
          запуска возвращается пустой срез.'
      - name: period
        in: query
        schema:
          type: string
          enum:
          - live
          - day
          - week
          - month
          - custom
          default: live
      - name: start_date
        in: query
        schema:
          type: string
          format: date-time
        description: Граница симуляционного времени с часовым поясом, [start_date, end_date).
          Обе границы обязательны вместе; максимум 366 дней.
      - name: end_date
        in: query
        schema:
          type: string
          format: date-time
        description: Граница симуляционного времени с часовым поясом, [start_date, end_date).
          Обе границы обязательны вместе; максимум 366 дней.
      - name: probability_percent
        in: query
        schema:
          type: number
          minimum: 0
          maximum: 100
          default: 100
        description: Сценарное допущение пользователя; не результат NLP и не фактический
          доход.
      - name: fine_per_case_rub
        in: query
        schema:
          type: number
          minimum: 0
          maximum: 100000000
          default: 50000
        description: Сценарное допущение пользователя; не результат NLP и не фактический
          доход.
      - name: offset
        in: query
        schema:
          type: integer
          minimum: 0
          default: 0
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 25
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinancialImpactTotal'
        '404':
          description: Запуск или кейс не найден
        '422':
          description: Некорректные параметры
