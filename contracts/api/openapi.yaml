                  next_cursor: { type: [string, "null"] }

  # ===================== v1.3 — аудиомониторинг и мисселлинг (ТЗ 22) =====================
  /api/compliance/branches:
    get:
      tags: [compliance]
      summary: Отделения с сотрудниками (для выбора на экране /compliance)
      responses:
        "200":
          description: OK
          content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Branch" } } } }
  /api/compliance/sessions:
    get:
      tags: [compliance]
      summary: Аудиосессии
      parameters:
        - $ref: "#/components/parameters/RunId"
        - { name: status, in: query, schema: { type: array, items: { type: string, enum: [live, alerted, closed] } }, style: form, explode: false }
        - { name: employee_id, in: query, schema: { type: integer } }
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: OK
          content: { application/json: { schema: { $ref: "#/components/schemas/AudioSessionList" } } }
    post:
      tags: [compliance]
      summary: Начать сессию (микрофон, файл или транскрипт)
      description: Возвращает URL бинарного WebSocket `/ws/audio/{session_id}` для `source = mic`; для `file|transcript` сервер сам проигрывает актив в реальном темпе.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [employee_id, source, diarization_mode]
              properties:
                employee_id: { type: integer }
                client_id: { type: [integer, "null"] }
                deal_product: { type: [string, "null"] }
                source: { type: string, enum: [mic, file, transcript] }
                demo_asset_id: { type: [integer, "null"], description: "обязателен для file|transcript" }
                diarization_mode: { type: string, enum: [stereo, manual, auto] }
                stt_provider: { type: [string, "null"], description: "null = провайдер по умолчанию из настроек" }
                alert_threshold: { type: integer, minimum: 1, maximum: 10, default: 3 }
                store_audio: { type: boolean, default: false }
      responses:
        "201":
          description: Сессия создана
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/AudioSession"
                  - type: object
                    properties:
                      audio_ws_url: { type: [string, "null"], description: "/ws/audio/{id} для source = mic" }
                      sample_rate: { type: integer, default: 16000 }
                      channels: { type: integer, enum: [1, 2] }
  /api/compliance/sessions/{id}:
    parameters: [ { $ref: "#/components/parameters/IdPath" } ]
    get:
      tags: [compliance]
      summary: Сессия с репликами, триггерами и алертами
      responses:
        "200":
          description: OK
          content: { application/json: { schema: { $ref: "#/components/schemas/AudioSessionDetail" } } }
        "404": { $ref: "#/components/responses/Problem" }
  /api/compliance/sessions/{id}/role:
    parameters: [ { $ref: "#/components/parameters/IdPath" } ]
    post:
      tags: [compliance]
      summary: Ручное переключение активной роли (режим manual, пробел на экране)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [speaker]
              properties:
                speaker: { type: string, enum: [employee, client] }
                at_ms: { type: [integer, "null"] }
      responses:
        "204": { description: Применено к следующим финальным репликам }
  /api/compliance/sessions/{id}/stop:
    parameters: [ { $ref: "#/components/parameters/IdPath" } ]
    post:
      tags: [compliance]
      summary: Завершить сессию
      responses:
        "200":
          description: Закрыта
          content: { application/json: { schema: { $ref: "#/components/schemas/AudioSession" } } }
  /api/compliance/sessions/{id}/utterances:
    parameters: [ { $ref: "#/components/parameters/IdPath" } ]
    get:
      tags: [compliance]
      summary: Финальные реплики сессии (для дозагрузки после разрыва WebSocket)
      parameters:
        - { name: since_seq, in: query, schema: { type: integer } }
      responses:
        "200":
          description: OK
          content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Utterance" } } } }
  /api/compliance/triggers/{id}:
    parameters: [ { $ref: "#/components/parameters/IdPath" } ]
    post:
      tags: [compliance]
      summary: Подтвердить или отклонить триггер вручную (руководитель/комплаенс)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [confirmed, dismissed] }
                comment: { type: [string, "null"] }
      responses:
        "200":
          description: OK
          content: { application/json: { schema: { $ref: "#/components/schemas/ComplianceTrigger" } } }
  /api/compliance/alerts:
    get:
      tags: [compliance]
      summary: Лента алертов для устройства руководителя (/manager)
      parameters:
        - { name: q, in: query, description: "Код SIG/INC или связанной сущности; фильтрация до пагинации", schema: { type: string, maxLength: 200 } }
        - $ref: "#/components/parameters/RunId"
        - { name: branch_code, in: query, schema: { type: string } }
        - { name: unacknowledged, in: query, schema: { type: boolean } }
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: OK
          content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/ComplianceAlert" } } } }
  /api/compliance/alerts/{id}/ack:
    parameters: [ { $ref: "#/components/parameters/IdPath" } ]
    post:
      tags: [compliance, hitl]
      summary: Реакция руководителя («Иду» / ложное / открыть инцидент) — пишется в HITL инцидента misselling
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision: { type: string, enum: [go, false_positive, open_incident] }
                comment: { type: [string, "null"] }
      responses:
        "200":
          description: OK
          content: { application/json: { schema: { $ref: "#/components/schemas/ComplianceAlert" } } }
  /api/compliance/patterns:
    get:
      tags: [compliance, settings]
      summary: Таксономия мисселлинга
      responses:
        "200":
          description: OK
          content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/MissellingPattern" } } } }
    put:
      tags: [compliance, settings]
      summary: Обновить таксономию (включение паттернов, ключевые слова, веса)
      requestBody:
        required: true
        content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/MissellingPattern" } } } }
      responses:
        "200": { description: Сохранено }
  /api/compliance/stats:
    get:
      tags: [compliance, metrics]
      summary: Статистика по сотрудникам/отделениям (v_compliance_by_employee)
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: OK
          content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/ComplianceEmployeeStats" } } } }

  # ===================== v1.3 — STT (ТЗ 5.3) =====================
  /api/stt/providers:
    get:
      tags: [stt, settings]
      summary: Доступные STT-провайдеры, их возможности и состояние
      responses:
        "200":
          description: OK
          content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/SttProvider" } } } }
  /api/stt/transcribe:
    post:
      tags: [stt]
      summary: "Надиктовать текст (T-206): PCM16 LE 16 кГц mono или WAV → текст"
      parameters:
        - { name: provider, in: query, schema: { type: string } }
        - { name: sample_rate, in: query, schema: { type: integer, default: 16000 } }
      requestBody:
        required: true
        content:
          application/octet-stream: { schema: { type: string, format: binary } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  provider: { type: string }
                  text: { type: string }
                  latency_ms: { type: integer }
                  audio_seconds: { type: number }
        "413": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /api/stt/test:
    post:
      tags: [stt, setup]
      summary: Проверка провайдера на коротком предзаписанном файле (мастер, шаг 4)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                provider: { type: string }
                demo_asset_id: { type: [integer, "null"] }
      responses:
        "200":
          description: Результат
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  provider: { type: string }
                  model: { type: [string, "null"] }
                  transcript: { type: string }
                  wer: { type: [number, "null"] }
                  partial_latency_ms: { type: [integer, "null"] }
                  final_latency_ms: { type: [integer, "null"] }
                  error: { type: [string, "null"] }

  # ===================== v1.3 — меню демонстратора и подстраховка (ТЗ 5.4, 12.7) =====================
  /api/demo/status:
    get:
      tags: [demo]
      summary: Состояние сети и провайдеров, текущие режимы LLM/STT
      responses:
        "200":
          description: OK
          content: { application/json: { schema: { $ref: "#/components/schemas/DemoStatus" } } }
  /api/demo/failover:
    post:
      tags: [demo]
      summary: Ручное переключение режима (LLM live|replay|mock; STT mic|file|transcript; восстановить онлайн)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [component, to]
              properties:
                component: { type: string, enum: [llm, stt, telegram] }
                to: { type: string }
      responses:
        "200":
          description: Применено; событие demo.failover
          content: { application/json: { schema: { $ref: "#/components/schemas/DemoStatus" } } }
  /api/demo/play/{scenario_id}:
    parameters:
      - { name: scenario_id, in: path, required: true, schema: { type: string } }
    post:
      tags: [demo, scenarios]
      summary: Запустить предзаписанный вход сценария (пост сценария 8, аудио/транскрипт сценария 9)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                asset_kind: { type: string, enum: [post, audio, transcript] }
                reset: { type: string, enum: [none, counters, baseline], default: none }
      responses:
        "202":
          description: Запущено
          content:
            application/json:
              schema:
                type: object
                properties:
                  post_id: { type: [integer, "null"] }
                  session_id: { type: [integer, "null"] }
                  agent_run_id: { type: [integer, "null"] }
  /api/demo/assets:
    get:
      tags: [demo]
      summary: Предзаписанные активы (аудио, транскрипты, посты, кассеты)
      parameters:
        - { name: kind, in: query, schema: { type: string, enum: [audio, transcript, post, cassette] } }
        - { name: scenario_id, in: query, schema: { type: string } }
      responses:
        "200":
          description: OK
          content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/DemoAsset" } } } }
  /api/cassettes:
    get:
      tags: [demo]
      summary: Кассеты replay (сводка по сценариям и моделям)
      responses:
        "200":
          description: OK
          content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/CassetteSummary" } } } }
  /api/cassettes/record:
    post:
      tags: [demo]
      summary: Включить/выключить запись кассет (LLM_RECORD) для текущей сессии показа
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled: { type: boolean }
                scenario_id: { type: [string, "null"] }
      responses:
        "200": { description: OK }

  /ws/audio/{session_id}:
    parameters:
      - { name: session_id, in: path, required: true, schema: { type: integer, format: int64 } }
    get:
      tags: [compliance, stt]
      summary: Бинарный WebSocket аудио → STT (ТЗ 5.3, 22.2)
      description: |
        Клиент шлёт бинарные кадры PCM16 LE 16 кГц (моно или интерливинг стерео, канал 1 — сотрудник, канал 2 — клиент) чанками по 100 мс.
        Первый текстовый кадр — `{"type":"hello","sample_rate":16000,"channels":1}`; сервер отвечает `{"type":"ready"}`.
        Сервер шлёт текстовые сообщения по схеме `contracts/events/compliance/stt_result.schema.json` (`partial` / `final` / `error`).
        Финальные реплики дублируются в `/ws/stream` (топики `stt`, `compliance`) для экранов-наблюдателей. Требует HTTPS или localhost на стороне браузера (getUserMedia).
      responses:
        "101": { description: Switching Protocols }

  /ws/stream:
    get:
      tags: [engine]
      summary: WebSocket — темы signals, agent, agent_tokens, incidents, notifications, sim, db, hitl, tasks, runs, feed, abs, compliance, stt, demo
      description: |
        Клиент после подключения отправляет `{"type":"subscribe","topics":["signals","agent", …],"filters":{…}}`.
        Сервер шлёт сообщения по схеме `contracts/events/ws/message.schema.json`. Heartbeat каждые 20 с.
        При разрыве клиент переподключается и дозагружает данные REST-запросами с `since_*`.
      responses:
        "101": { description: Switching Protocols }

  /api/ingest/messages:
    post:
      tags: [ingest]
      summary: "[ДТЗ FR-1.2–1.3] Приём сообщения (или массива) в единой схеме; нормализация, матчинг клиента, создание сигнала"
      parameters: [{ name: source, in: query, schema: { type: string, default: rest_default }, description: "Код адаптера ingest_sources" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - { $ref: "../events/ingest/unified_message.schema.json" }
                - { type: array, maxItems: 500, items: { $ref: "../events/ingest/unified_message.schema.json" } }
      responses:
        "202":
          description: Принято (дубли по external_id помечены)
          content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: "#/components/schemas/IngestResult" } } } } } }
        "422": { $ref: "#/components/responses/Problem" }
  /api/ingest/transcripts:
    get:
      tags: [ingest]
      summary: "[ДТЗ FR-1.1] Список импортированных транскриптов"
      parameters:
        - { name: q, in: query, description: "Код SIG/INC или связанной сущности; фильтрация до пагинации", schema: { type: string, maxLength: 200 } }
        - { $ref: "#/components/parameters/RunId" }
        - { name: kind, in: query, schema: { $ref: "#/components/schemas/TranscriptKind" } }
        - { name: status, in: query, schema: { type: string, enum: [received, analyzing, done, failed] } }
        - { name: employee_id, in: query, schema: { type: integer } }
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Cursor" }
      responses:
        "200":
          description: OK
          content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: "#/components/schemas/TranscriptBrief" } }, next_cursor: { type: [string, "null"] } } } } }
    post:
      tags: [ingest]
      summary: "[ДТЗ FR-1.1, FR-4.1] Приём транскрипта: JSON по схеме ingest/transcript или multipart с файлами JSON/TXT; запускает анализы client_signal и/или employee_quality"
      parameters: [{ name: analyses, in: query, schema: { type: array, items: { type: string, enum: [client_signal, employee_quality] } }, style: form, explode: false, description: "Переопределяет analyses из тела/настроек по kind" }]
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: "../events/ingest/transcript.schema.json" } }
          multipart/form-data:
            schema:
              type: object
              required: [files]
              properties:
                files: { type: array, items: { type: string, format: binary }, description: ".json или .txt («[чч:мм:сс] Сотрудник: …» / «Клиент: …»)" }
                kind: { $ref: "#/components/schemas/TranscriptKind" }
                branch_code: { type: string }
                employee_public_id: { type: string }
      responses:
        "202":
          description: Принято, анализ запущен
          content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: "#/components/schemas/TranscriptBrief" } } } } } }
        "422": { $ref: "#/components/responses/Problem" }
  /api/ingest/transcripts/import:
    post:
      tags: [ingest]
      summary: "[ДТЗ FR-1.1] Пакетный импорт каталога data/import/transcripts/ (кнопка в настройках)"
      responses:
        "202":
          description: Запущено
          content: { application/json: { schema: { type: object, properties: { files_found: { type: integer }, accepted: { type: integer }, duplicates: { type: integer }, rejected: { type: integer } } } } }
  /api/ingest/transcripts/{id}:
    parameters: [{ $ref: "#/components/parameters/IdPath" }]
    get:
      tags: [ingest]
      summary: "Транскрипт целиком: реплики, статус анализов, ссылки на сигнал и пакетную сессию, отчёт"
      responses:
        "200":
          description: OK
          content: { application/json: { schema: { $ref: "#/components/schemas/TranscriptDetail" } } }
        "404": { $ref: "#/components/responses/Problem" }
  /api/ingest/transcripts/{id}/analyze:
    parameters: [{ $ref: "#/components/parameters/IdPath" }]
    post:
      tags: [ingest]
      summary: "Повторить/дозапустить анализ транскрипта (например, employee_quality для контакт-центра)"
      requestBody:
        content: { application/json: { schema: { type: object, properties: { analyses: { type: array, items: { type: string, enum: [client_signal, employee_quality] } } } } } }
      responses:
        "202": { description: Запущено }
        "409": { $ref: "#/components/responses/Problem" }
  /api/ingest/sources:
    get:
      tags: [ingest]
      summary: "[ДТЗ FR-1.2] Адаптеры источников (REST / polling / file) и их статистика"
      responses:
        "200":
          description: OK
          content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: "#/components/schemas/IngestSource" } } } } } }
  /api/ingest/sources/{code}:
    parameters: [{ name: code, in: path, required: true, schema: { type: string } }]
    put:
      tags: [ingest]
      summary: Создать/обновить адаптер (enabled, interval_s, config.url)
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/IngestSourceUpdate" } } }
      responses:
        "200":
          description: OK
          content: { application/json: { schema: { $ref: "#/components/schemas/IngestSource" } } }
        "422": { $ref: "#/components/responses/Problem" }
  /api/ingest/sources/{code}/poll:
    parameters: [{ name: code, in: path, required: true, schema: { type: string } }]
    post:
      tags: [ingest]
