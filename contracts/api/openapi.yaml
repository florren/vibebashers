        schema:
          type: string
          format: date-time
        description: Граница симуляционного времени с часовым поясом, [start_date, end_date).
          Обе границы обязательны вместе; максимум 366 дней.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinanceAssessment'
        '404':
          description: Запуск не найден
        '422':
          description: Ошибка параметров
  /api/v1/finance/impact/evidence:
    post:
      tags:
      - finance
      summary: 'T-265: добавить версию декларации вмешательства; идемпотентный ключ,
        без денежных проводок'
      parameters:
      - name: run_id
        in: query
        schema:
          type: string
          default: current
        description: 'Один запуск: current или положительный id. all запрещён. Без текущего
          запуска возвращается пустой срез.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FinanceEvidenceBody'
      responses:
        '201':
          description: Записано или точный повтор; новая версия сделки отзывает прежнюю
            оценку
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinanceEvidenceResult'
        '404':
          description: Алерт вне запуска
        '409':
          description: Нет политики/запуска или конфликт ключа
        '422':
          description: Некорректное доказательство

  /api/personal/session:
    get:
      tags: [personal]
      summary: Анонимная сессия и справочники отдельного чата
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/PersonalSession" } } } }
  /api/personal/messages:
    get:
      tags: [personal]
      summary: Только собственная история чата (HttpOnly session cookie)
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/PersonalHistory" } } } }
    post:
      tags: [personal]
      summary: Сообщение анонимного посетителя с тегом ui_pers_demo
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: "#/components/schemas/PersonalMessageBody" } }
      responses:
        "202": { description: Принято штатным normalizer, content: { application/json: { schema: { type: object, required: [accepted, public_id], properties: { accepted: { type: boolean }, public_id: { type: string } } } } } }
        "429": { description: Пассивная защита; Retry-After позволяет дождаться отправки без CAPTCHA }
  /api/personal/reset:
    post:
      tags: [personal]
      summary: Забыть анонимную сессию в этом браузере
      responses:
        "204": { description: Cookie удалена; история остаётся в обработке }
  /api/personal/health:
    get:
      tags: [personal]
      summary: Готовность публичного приложения
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object, properties: { status: { type: string } } } } } }

components:
  parameters:
    IdPath: { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    Limit: { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 50 } }
    Cursor: { name: cursor, in: query, schema: { type: string } }
    RunId: { name: run_id, in: query, schema: { type: string }, description: "Запуск эмуляции (ТЗ 4.6): id, `current` (по умолчанию), `all`. Для лент/карточек по умолчанию baseline + current." }
    CxRole:
      name: X-Cx-Role
      in: header
      schema: { type: string }
      description: "[ЕТЗ] Пресет роли кабинета (фильтр представления, не авторизация)"
    CxProductLine:
      name: X-Cx-Product-Line
      in: header
      schema: { $ref: "../events/common.schema.json#/$defs/product_line" }
      description: "[ЕТЗ] Выбранное продуктовое направление для пресета"
  responses:
    Problem:
      description: Ошибка (RFC 9457)
      content:
        application/problem+json:
          schema:
            type: object
            required: [type, title, status]
            properties:
              type: { type: string, format: uri }
              title: { type: string }
              status: { type: integer }
              detail: { type: string }
              instance: { type: string }
              errors: { type: array, items: { type: object, properties: { loc: { type: array, items: { type: string } }, msg: { type: string } } } }
  schemas:
    DemoExecutionRequest:
      type: object
      additionalProperties: false
      allOf:
      - if:
          required: [mode]
          properties:
            mode:
              const: simulation
        else:
          required: [scenario_id]
          properties:
            scenario_id:
              type: string
              minLength: 1
      properties:
        scenario_id:
          type:
          - string
          - 'null'
          description: Обязателен при mode=demo.
        mode:
          type: string
          enum: [demo, simulation]
          default: demo
          description: Изолированный сценарий либо профиль общей симуляции и ручных входов.
        team_outcome:
          type: string
          enum:
          - on_time
          - late
          - no_work
          - failed
          - recovered
          default: on_time
        emulate_humans:
          type: boolean
          default: true
        auto_advance:
          type: boolean
          default: true
    DemoExecutionState:
      type: object
      required:
      - run_id
      - subject_ref
      - configuration
      - incidents
      properties:
        run_id:
          type:
          - integer
          - 'null'
        subject_ref:
          type: [string, "null"]
        configuration:
          type: object
          additionalProperties: true
        incidents:
          type: array
          items:
            type: object
            required:
            - id
            - public_id
            - status
            - sla_breached
            - resolution_summary
            properties:
              id:
                type: integer
              public_id:
                type: string
              status:
                type: string
              sla_breached:
                type: boolean
              can_recover:
                type: boolean
                description: Доступно явное продолжение неудачной ручной demo-попытки.
              resolution_summary:
                type:
                - string
                - 'null'
    LlmProvider: { type: string, enum: [gigachat, openai_compatible, mock] }
    Complexity: { type: string, enum: [easy, medium, hard] }
    Criticality: { type: string, enum: [low, medium, high] }
    IncidentStatus: { type: string, enum: [new, classified, routed, in_progress, fix_proposed, fix_deployed, verifying, resolved, closed, awaiting_human, awaiting_client, escalated, duplicate, rejected] }
    SignalStatus: { $ref: "../events/common.schema.json#/$defs/signal_status" }
    OutcomeClass: { type: string, enum: [closed_in_sla_with_gift, closed_in_sla, closed_late, closed_with_regression, open, rejected, churned] }
    ClientState: { type: string, enum: [calm, affected, complaining, waiting, satisfied, asks_again, escalates, churn_intent, retained, churned] }

    EnvVar:
      type: object
      required: [key, is_secret, is_set, source, requires_restart, description]
      properties:
        key: { type: string }
        value: { type: [string, "null"], description: Значение; у секретов всегда null }
        hint: { type: [string, "null"], description: Хвост секрета («…1234»), если задан }
        is_secret: { type: boolean }
        is_set: { type: boolean }
        source: { type: string, enum: [file, process, default] }
        requires_restart: { type: boolean, description: PROFILE, SIM_SEED — нужен перезапуск процесса }
        description: { type: string }
    EnvUpdate:
      type: object
      required: [values]
      properties:
        values:
          type: object
          additionalProperties: { type: [string, "null"] }
          description: KEY → значение; null или пустая строка очищают ключ; маска секрета («…1234») игнорируется
        apply: { type: boolean, default: true, description: Горячо применить — переменные процесса, кэш Settings, цепочка LLM агента }
    EnvResult:
      type: object
      properties:
        path: { type: string }
        written: { type: array, items: { type: string } }
        applied: { type: boolean }
        restart_required: { type: array, items: { type: string } }
        llm_chain: { type: array, items: { type: string } }
        llm_profile: { type: [string, "null"] }
        warnings: { type: array, items: { type: string } }
    SetupPayload:
      type: object
      properties:
        llm: { type: object, properties: { main_profile_id: { type: integer }, fast_profile_id: { type: integer }, twin_profile_id: { type: integer } } }
        bank: { type: object, properties: { name: { type: string }, clients_profile: { type: string, enum: [lite, demo, stress] }, regions_mode: { type: string }, region_codes: { type: array, items: { type: string } }, segment_shares: { type: object, additionalProperties: { type: number } } } }
        sim: { type: object, properties: { sim_hour_real_minutes: { type: number }, seed: { type: integer }, intensities: { type: object, additionalProperties: { type: number } }, fault_rate: { type: number } } }
        channels: { type: object, properties: { enabled: { type: array, items: { type: string } }, mailpit: { type: boolean }, tgbot_enabled: { type: boolean } } }
        policies: { type: object, properties: { confidence_threshold: { type: number }, hitl_rules: { type: object, additionalProperties: { type: number }, description: "Переопределения DEFAULT_POLICIES агента (clarification_threshold, fraud_amount_rub, repeat_hitl_count, escalation_negativity, escalation_signals_7d, refund_autonomy_limit_rub, refund_autonomy_limit_premium_rub, mass_refund_threshold)" }, dedup_window_hours: { type: integer } } }
        economics: { $ref: "#/components/schemas/EconomicsSettings" }
        ui: { type: object, properties: { lang: { type: string, enum: [ru, en] }, theme: { type: string, enum: [dark, light, circadian] } } }
    CoverageMatrix:
      type: object
      description: Матрица покрытия (ТЗ 4.4) — заполненные комбинации и дефициты
      properties:
        signal_type_x_product_x_channel: { type: object, additionalProperties: { type: integer } }
        sla_cells: { type: object, additionalProperties: { type: integer }, description: "ключ complexity:criticality → инцидентов" }
        segments: { type: object, additionalProperties: { type: integer } }
        districts: { type: object, additionalProperties: { type: integer } }
        psychotypes: { type: object, additionalProperties: { type: integer } }
        gaps: { type: array, items: { type: string } }
        passed: { type: boolean }
    SlaCell:
      type: object
      required: [complexity, criticality, fix_days, report_days, take_hours]
      properties:
        complexity: { $ref: "#/components/schemas/Complexity" }
        criticality: { $ref: "#/components/schemas/Criticality" }
        fix_days: { type: integer, minimum: 1, maximum: 10 }
        report_days: { type: array, items: { type: integer } }
        take_hours: { type: integer }
    RoutingRule:
      type: object
      required: [match, team_codes]
      properties:
        id: { type: integer }
        priority: { type: integer }
        match: { type: object, additionalProperties: true }
        team_codes: { type: array, items: { type: string }, minItems: 1 }
        notes_ru: { type: string }
    LlmProfile:
      type: object
      required: [code, provider, model, role]
      properties:
        id: { type: integer, readOnly: true }
        code: { type: string }
        provider: { $ref: "#/components/schemas/LlmProvider" }
        model: { type: string }
        base_url: { type: [string, "null"] }
        role: { type: string, enum: [main, fast, twin, bench_only] }
        temperature: { type: number }
        rpm_limit: { type: [integer, "null"] }
        rpd_limit: { type: [integer, "null"] }
        price_in_per_1m: { type: number }
        price_out_per_1m: { type: number }
        supports_tools: { type: boolean }
        supports_stream: { type: boolean }
        is_active: { type: boolean }
        api_key_id: { type: [integer, "null"] }
    LlmApiKey:
      type: object
      properties:
        id: { type: integer }
        provider: { $ref: "#/components/schemas/LlmProvider" }
        label: { type: string }
        tokens_used: { type: integer }
        tokens_limit: { type: [integer, "null"] }
        requests_today: { type: integer }
        rpd_limit: { type: [integer, "null"] }
        balance_usd: { type: [number, "null"], description: OpenRouter — из GET /api/v1/key }
        is_active: { type: boolean }
        last_error: { type: [string, "null"] }
    NotificationTemplate:
      type: object
      required: [code, channel_code, body]
      properties:
        id: { type: integer }
        code: { type: string }
        channel_code: { type: string }
        segment_code: { type: [string, "null"] }
        lang: { type: string, default: ru }
        subject: { type: [string, "null"] }
        body: { type: string }
        variables: { type: array, items: { type: string } }
    GiftCatalogItem:
      type: object
      required: [code, name_ru, name_en, segments, rule]
      properties:
        code: { type: string }
        name_ru: { type: string }
        name_en: { type: string }
        segments: { type: array, items: { type: string } }
        rule: { type: object, additionalProperties: true }
        partner_display_name: { type: [string, "null"] }
    EconomicsSettings:
      type: object
      properties:
        detractor_share: { type: number, minimum: 0, maximum: 1 }
        no_return_share: { type: number, minimum: 0, maximum: 1 }
        retention_factors:
          type: object
          properties:
            closed_in_sla_with_gift: { type: number }
            closed_in_sla: { type: number }
            closed_late: { type: number }
            closed_with_regression: { type: number }
            open: { type: number }
            rejected: { type: number }
            churned: { type: number }
        calibration_mode: { type: string, enum: [manual, simulated] }
        fallback_rate_code: { type: string, default: bank_average }
        misselling_case_cost_rub: { type: [number, "null"], description: "Стоимость одного кейса мисселинга (economics_settings.misselling_case_cost_rub)" }
        map_zone_thresholds: { type: [object, "null"], additionalProperties: true, description: "Пороги зон карты: yellow, red, critical_red, copilot_weight, window_sim_hours" }
        rates:
          type: array
          items:
            type: object
            required: [code, name_ru, rate_rub]
            properties:
              code: { type: string }
              name_ru: { type: string }
              name_en: { type: string }
              rate_rub: { type: number }
              maps_to: { type: object, additionalProperties: true }
    PsychotypeSettings:
      type: object
      properties:
        psychotypes:
          type: array
          items:
            type: object
            required: [code, name_ru, name_en, params]
            properties:
              code: { type: string }
              name_ru: { type: string }
              name_en: { type: string }
              params: { $ref: "../events/behavior/psychotype_params.schema.json" }
        segment_mix:
          type: object
          description: "segment_code → {psychotype_code: share}; сумма по сегменту = 1"
          additionalProperties: { type: object, additionalProperties: { type: number } }
        twins:
          type: object
          properties:
            daily_limit: { type: integer, default: 20 }
            include_vip: { type: boolean, default: true }
            include_hitl: { type: boolean, default: true }
            include_scenarios: { type: boolean, default: true }
    SimState:
      type: object
      properties:
        sim_time: { type: string, format: date-time }
        day_no: { type: integer }
        phase: { type: string, enum: [morning, day, evening, night] }
        speed: { type: number }
        running: { type: boolean }
        seed: { type: integer }
        is_working_day: { type: boolean }
        current_run_id: { type: [integer, "null"] }
        current_run_status: { type: [string, "null"], enum: [running, paused, interrupted, completed, stopped, archived, null] }
        baseline_available: { type: boolean }
    SimRun:
      type: object
      description: "Запуск эмуляции (ТЗ 4.6, таблица sim_runs + v_run_counters)"
      required: [id, kind, label, status, seed, started_sim]
      properties:
        id: { type: integer, format: int64 }
        kind: { type: string, enum: [baseline, free, scenario] }
        label: { type: string }
        scenario_id: { type: [string, "null"] }
        seed: { type: integer }
        llm_profile_id: { type: [integer, "null"] }
        reset_mode: { type: [string, "null"], enum: [none, counters, baseline, null] }
        parent_run_id: { type: [integer, "null"] }
        status: { type: string, enum: [running, paused, interrupted, completed, stopped, archived] }
        started_sim: { type: string, format: date-time }
        finished_sim: { type: [string, "null"], format: date-time }
        started_at: { type: string, format: date-time }
        finished_at: { type: [string, "null"], format: date-time }
        resumed_count: { type: integer }
        counters:
          type: object
          description: "Живые счётчики (v_run_counters)"
          properties:
            signals: { type: integer }
            incidents: { type: integer }
            incidents_open: { type: integer }
            sla_breached: { type: integer }
            hitl_requests: { type: integer }
            churned: { type: integer }
            tokens: { type: integer }
            prevented_loss_rub: { type: number }
            realized_loss_rub: { type: number }
        summary:
          type: [object, "null"]
          description: "Итоговые метрики после stop/complete — DashboardMetrics + EconomicsSummary + расход токенов по профилям"
          additionalProperties: true
        settings_snapshot: { type: object, additionalProperties: true }
        export_path: { type: [string, "null"] }
        notes: { type: [string, "null"] }
    BaselineInfo:
      type: object
      properties:
        available: { type: boolean }
        path: { type: [string, "null"] }
        profile: { type: [string, "null"], enum: [lite, demo, stress, null] }
        seed: { type: [integer, "null"] }
        size_bytes: { type: [integer, "null"] }
        sha256: { type: [string, "null"] }
        created_at: { type: [string, "null"], format: date-time }
        baseline_run_id: { type: [integer, "null"] }
    SimEvent:
      type: object
      properties:
        id: { type: integer }
        run_id: { type: integer, format: int64 }
        event_type: { type: string }
        payload: { type: object, additionalProperties: true }
        sim_time: { type: string, format: date-time }
        real_time: { type: string, format: date-time }
        scenario_id: { type: [string, "null"] }
        correlation_id: { type: string, format: uuid }
    SimEventList: { type: object, properties: { items: { type: array, items: { $ref: "#/components/schemas/SimEvent" } }, next_cursor: { type: [string, "null"] } } }
    Scenario:
      type: object
      properties:
        id: { type: string }
        title_ru: { type: string }
        title_en: { type: string }
        description_ru: { type: string }
        duration_sim_hours: { type: number }
        last_run_at: { type: [string, "null"], format: date-time }
        last_result: { type: [object, "null"], properties: { passed: { type: boolean }, checks: { type: array, items: { type: object } } } }
    ExternalContact:
      type: object
      properties:
        name: { type: string }
        phone: { type: string, description: Только вымышленный диапазон +7 900 000-xx-xx }
        email: { type: string }
        nick: { type: string }
        region_code: { type: string }
        city_id: { type: integer }
        telegram_chat_id: { type: integer }
    Signal:
      type: object
      properties:
        tags: { type: array, items: { type: string } }
        run_id: { type: integer }
        run_public_id: { type: string }
        incident_refs: { type: array, items: { type: string }, description: Коды связанных инцидентов в том же запуске }
        sentiment: { anyOf: [{ $ref: "#/components/schemas/Sentiment" }, { type: "null" }], description: "[ДТЗ]" }
        geo: { anyOf: [{ $ref: "#/components/schemas/Geo" }, { type: "null" }], description: "[ДТЗ]" }
        id: { type: integer }
        public_id: { type: string }
        channel_code: { type: string }
        channel_subtype: { type: [string, "null"] }
        client: { anyOf: [{ $ref: "#/components/schemas/ClientBrief" }, { type: "null" }] }
        external_contact: { anyOf: [{ $ref: "#/components/schemas/ExternalContact" }, { type: "null" }] }
        text: { type: string }
        received_sim: { type: string, format: date-time }
        status: { $ref: "#/components/schemas/SignalStatus" }
        origin: { type: string }
        classification: { anyOf: [{ $ref: "../events/agent/classification.schema.json" }, { type: "null" }] }
        region_code: { type: [string, "null"] }
        incident_ids: { type: array, items: { type: integer } }
    SignalList: { type: object, properties: { items: { type: array, items: { $ref: "#/components/schemas/Signal" } }, next_cursor: { type: [string, "null"] }, total: { type: integer } } }
    SignalDetail:
      allOf:
        - $ref: "#/components/schemas/Signal"
        - type: object
          properties:
            decision: { anyOf: [{ $ref: "../events/agent/decision.schema.json" }, { type: "null" }] }
            incidents: { type: array, items: { $ref: "#/components/schemas/IncidentBrief" } }
            agent_runs: { type: array, items: { $ref: "#/components/schemas/AgentRunBrief" } }
            notifications: { type: array, items: { $ref: "#/components/schemas/Notification" } }
            followups: { type: array, items: { $ref: "#/components/schemas/Followup" } }
    Followup:
      type: object
      properties:
        id: { type: integer }
        wake_sim: { type: string, format: date-time }
        reason: { type: string }
        status: { type: string, enum: [scheduled, fired, cancelled] }
    DeferredList:
      type: object
      properties:
        items: { type: array, items: { type: object, properties: { signal: { $ref: "#/components/schemas/Signal" }, followup: { $ref: "#/components/schemas/Followup" } } } }
        next_cursor: { type: [string, "null"] }
    ClientBrief:
      type: object
      properties:
        id: { type: integer }
        public_id: { type: string }
        display_name: { type: string }
        segment_code: { type: string }
        region_code: { type: string }
        city_name: { type: string }
        churn_risk: { type: integer }
        is_active: { type: boolean }
    Client360:
      allOf:
        - $ref: "#/components/schemas/ClientBrief"
        - type: object
          properties:
            psychotype: { type: object, properties: { code: { type: string }, name_ru: { type: string }, name_en: { type: string }, communication_hint_ru: { type: string } } }
            clv_estimate_rub: { type: integer }
            contacts: { type: object, additionalProperties: true }
            products: { type: array, items: { type: object, additionalProperties: true } }
            operations: { type: array, items: { type: object, additionalProperties: true } }
            signals: { type: array, items: { $ref: "#/components/schemas/Signal" } }
            incidents: { type: array, items: { $ref: "#/components/schemas/IncidentBrief" } }
            current_state: { type: object, properties: { state: { $ref: "#/components/schemas/ClientState" }, since_sim: { type: string, format: date-time }, care_score: { type: [number, "null"] }, hazard: { type: [number, "null"] } } }
            state_history: { type: array, items: { type: object, additionalProperties: true } }
            gifts: { type: array, items: { $ref: "#/components/schemas/Task" } }
    IncidentBrief:
      type: object
      properties:
        id: { type: integer }
        public_id: { type: string }
        title: { type: string }
        incident_type: { type: string }
        product_code: { type: [string, "null"] }
