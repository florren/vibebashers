      type: object
      required: [form_token, products, regions, cities, tag, minimum_form_ms]
      properties:
        display_name: { type: string, maxLength: 120, description: Неподтверждённое обращение посетителя из последнего сообщения собственной сессии }
        form_token: { type: string }
        tag: { type: string, const: ui_pers_demo }
        minimum_form_ms: { type: integer }
        products: { type: array, items: { type: object, required: [code, name_ru, name_en], properties: { code: { type: string }, name_ru: { type: string }, name_en: { type: string } } } }
        regions: { type: array, items: { type: object, required: [code, name_ru], properties: { code: { type: string }, name_ru: { type: string } } } }
        cities: { type: array, items: { type: object, required: [id, name_ru, region_code], properties: { id: { type: integer }, name_ru: { type: string }, region_code: { type: string } } } }
    PersonalMessageBody:
      type: object
      additionalProperties: false
      required: [request_id, form_token, text]
      properties:
        request_id: { type: string, format: uuid }
        form_token: { type: string, minLength: 64, maxLength: 64 }
        text: { type: string, minLength: 1, maxLength: 4000 }
        display_name: { type: [string, "null"], maxLength: 120, pattern: '^[^\x00-\x1f\x7f-\x9f]*$', description: Необязательное имя или псевдоним; null сохраняет предыдущее обращение, пустая строка убирает его }
        product_code: { type: [string, "null"], maxLength: 100 }
        region_code: { type: [string, "null"], maxLength: 10 }
        city_id: { type: [integer, "null"] }
        website: { type: string, maxLength: 200, default: "" }
        voice: { type: boolean, default: false }
    PersonalHistory:
      type: object
      required: [messages, answers]
      properties:
        messages: { type: array, items: { type: object, required: [public_id, text, status, received_at], properties: { public_id: { type: string }, text: { type: string }, display_name: { type: string, maxLength: 120 }, status: { type: string }, received_at: { type: string, format: date-time } } } }
        answers: { type: array, items: { type: object, required: [id, text, at], properties: { id: { type: integer }, text: { type: string }, at: { type: string, format: date-time } } } }
