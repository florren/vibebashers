        "200": { description: Сохранено }
        "422": { $ref: "#/components/responses/Problem" }
  /api/rules/evaluate:
    post:
      tags: [rules]
      summary: Проверить правила для операции/клиента (отладка, панель Log)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                operation_id: { type: [integer, "null"] }
                client_id: { type: [integer, "null"] }
