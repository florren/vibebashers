# ТЗ 22.4 / 22.8 — таксономия паттернов: семейства misselling и conduct; примеры синтетические
patterns:
  - code: tie_in
    family: misselling
    name_ru: Жёсткая привязка услуги
    name_en: Tie-in
    description_ru: "Навязывание дополнительной услуги как обязательного условия основной сделки"
    examples: ["без страховки вам не одобрят", "кредит только со страховкой", "карту выдадим, если оформите подписку", "одобрение будет только при подключении защиты карты"]
    counter_examples: ["страховка снизит ставку на 2 процентных пункта, решение за вами", "подписка не обязательна, карту выдадим в любом случае"]
    keywords: ["только со страховкой", "не одобрят", "обязательно оформить", "выдадим, если", "без страховки", "условие одобрения"]
    weight: 1.0
    is_active: true
    alert_policy: counter
    immediate_threshold: 0.8
    recommendation_ru: "Разделять основной продукт и допуслуги; явно проговаривать добровольность"
    training_module: "Продажи без привязки (модуль 2)"
  - code: substitution
    family: misselling
    name_ru: Подмена понятий
    name_en: Substitution
    description_ru: "Инвестиционный/страховой продукт представлен как вклад или гарантированный доход"
    examples: ["это как вклад, только лучше", "тот же депозит, но доходнее", "это не инвестиции, это накопления с гарантией", "по сути тот же вклад, только ставка выше"]
    counter_examples: ["это инвестиционный продукт, доход не гарантирован, в отличие от вклада", "это страхование жизни с инвестиционной частью, не вклад"]
    keywords: ["как вклад", "тот же депозит", "это не инвестиции", "накопления с гарантией", "по сути вклад", "аналог вклада"]
    weight: 1.0
    is_active: true
    alert_policy: counter
    immediate_threshold: 0.8
    recommendation_ru: "Называть продукт своим именем, сравнивать с вкладом только по рискам"
    training_module: "ИСЖ/НСЖ: честное раскрытие (модуль 3)"
  - code: concealment
    family: misselling
    name_ru: Утаивание информации
    name_en: Concealment
    description_ru: "Сокрытие существенных условий: комиссии, срок, досрочное расторжение"
    examples: ["подпишите, это формальность", "условия стандартные, читать не обязательно", "комиссий нет", "там мелкий шрифт, ничего важного"]
    counter_examples: ["обратите внимание на пункт о досрочном расторжении", "комиссия за обслуживание 199 рублей в месяц, вот строка в договоре"]
    keywords: ["это формальность", "читать не обязательно", "комиссий нет", "ничего важного", "потом почитаете", "стандартные условия"]
    weight: 1.0
    is_active: true
    alert_policy: counter
    immediate_threshold: 0.8
    recommendation_ru: "Проговаривать комиссии, сроки и условия расторжения до подписания"
    training_module: "Раскрытие условий (модуль 1)"
  - code: pressure
    family: misselling
    name_ru: Давление / искусственная срочность
    name_en: Pressure
    description_ru: "Давление на клиента через ложную срочность"
    examples: ["только сегодня", "решайте сейчас, потом не будет", "последний день акции, завтра ставка упадёт", "пока вы думаете, предложение сгорит"]
    counter_examples: ["акция действует до 30 ноября, у вас есть время подумать", "могу зафиксировать условия на три дня"]
    keywords: ["только сегодня", "решайте сейчас", "потом не будет", "последний день", "сгорит", "прямо сейчас"]
    weight: 0.8
    is_active: false
    alert_policy: counter
    immediate_threshold: 0.8
    recommendation_ru: "Сообщать реальный срок акции с датой, давать время на решение"
    training_module: "Этика продаж (модуль 4)"
  - code: guarantee
    family: misselling
    name_ru: Гарантия доходности инвестпродукта
    name_en: Guaranteed return
    description_ru: "Обещание гарантированной доходности по продукту с рыночным риском"
    examples: ["гарантированно 20 % годовых", "доходность гарантирована, никаких рисков", "вы точно заработаете больше, чем на вкладе"]
    counter_examples: ["историческая доходность 12 % не гарантирует будущую", "доход зависит от рынка, возможен и убыток"]
    keywords: ["гарантированно", "гарантирована", "никаких рисков", "точно заработаете", "100 % доход"]
    weight: 1.2
    is_active: false
    alert_policy: counter
    immediate_threshold: 0.8
    recommendation_ru: "Говорить о рисках и исторической доходности без гарантий"
    training_module: "Инвестпродукты: риски (модуль 5)"
  - code: rudeness
    family: conduct
    name_ru: Грубость, пренебрежение, обвинение клиента
    name_en: Rudeness
    description_ru: "Грубые, пренебрежительные или обвиняющие формулировки в адрес клиента"
    examples: ["вы вообще читали условия?", "это не моя проблема", "я вам уже три раза сказала", "не надо мне тут рассказывать", "вы сами виноваты"]
    counter_examples: ["понимаю, условия непростые, давайте разберём вместе", "давайте я ещё раз поясню"]
    keywords: ["вы вообще", "не моя проблема", "уже три раза", "сами виноваты", "не надо мне", "что непонятного", "слушайте внимательно"]
    weight: 1.0
    is_active: true
    alert_policy: immediate
    immediate_threshold: 0.8
    recommendation_ru: "Нейтральный тон, эмпатия, без обвинений"
    training_module: "Сервисная коммуникация (модуль 6)"
  - code: script_violation
    family: conduct
    name_ru: Нарушение скрипта обслуживания
    name_en: Script violation
    description_ru: "Пропуск этапов скрипта (приветствие, идентификация, потребность, резюме) или запрещённые формулировки"
    examples: ["подпишите, потом почитаете", "давайте сразу к делу, оформляем кредитку", "паспорт не нужен, я вас и так помню"]
    counter_examples: ["здравствуйте, меня зовут Анна, чем могу помочь?", "давайте уточню, какая у вас задача", "подведу итог: мы оформили…"]
    keywords: ["потом почитаете", "сразу к делу", "паспорт не нужен", "и так помню", "давайте быстрее"]
    weight: 0.7
    is_active: true
    alert_policy: report
    immediate_threshold: 0.8
    recommendation_ru: "Соблюдать этапы retail_service_v1; резюмировать условия перед подписанием"
    training_module: "Скрипт обслуживания (модуль 0)"
  - code: misinformation
    family: conduct
    name_ru: Неверная информация о продукте
    name_en: Misinformation
    description_ru: "Утверждения о ставках, комиссиях, сроках, противоречащие тарифам"
    examples: ["ставка по вкладу 14 %", "комиссия за СБП 1 %", "льготный период 200 дней", "снятие с кредитки бесплатно"]
    counter_examples: ["ставка по вкладу 9,5 %, промо 14 % действовало до прошлой недели", "оплата по QR без комиссии"]
    keywords: ["ставка", "комиссия", "льготный период", "бесплатно", "процент", "годовых"]
    weight: 1.0
    is_active: true
    alert_policy: immediate
    immediate_threshold: 0.8
    recommendation_ru: "Сверять цифры с тарифами; при сомнении — открыть тарифную таблицу при клиенте"
    training_module: "Продуктовые знания (модуль 7)"
