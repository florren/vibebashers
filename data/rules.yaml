# ТЗ 8.x / BRD — бизнес-правила (детерминированные, применяются до LLM). condition — DSL для app/rules/engine.py
business_rules:
  - code: RULE-QR-FEE-001
    name_ru: "Комиссия за оплату по QR (СБП) при нулевом тарифе"
    name_en: "QR/SBP fee charged while tariff is zero"
    condition: {all: [{field: operation.op_type, eq: card_payment}, {field: operation.method, eq: qr_sbp}, {field: operation.fee_amount, gt: 0}, {field: tariff.fee_pct, eq: 0}]}
    action: refund_fee
    limits: {max_amount_rub: 5000, per_client_30d: 3}
    owner_team_code: team_processing
    error_code: PROC-QR-FEE-CHARGED
    is_active: true
    case_scope:
      allowed_intents: [complaint, refund_request]
      blocked_intents: [gratitude]
      request_intents: [refund_request]
      topic_patterns: ['комисси', '\bfees?\b', '\bcommission\b']
      evidence_patterns: ['списал|списан|списыв|снял|удерж|charged|debited|ошибочн|лишн|неверн|erroneous|incorrect']
      blocked_patterns: ['вклад|депозит|ипотек|кредит']
      operation: {product: [debit_card], method: [qr_sbp], op_type: [card_payment]}
  - code: RULE-DOUBLE-DEBIT-001
    name_ru: "Двойное списание"
    name_en: "Double debit"
    condition: {all: [{field: ledger.kind, eq: debit}, {duplicate_within_s: 120, by: [amount, merchant]}]}
    action: refund_fee
    limits: {max_amount_rub: 50000, per_client_30d: 2}
    owner_team_code: team_processing
    error_code: PROC-DOUBLE-DEBIT
    is_active: true
    case_scope:
      allowed_intents: [complaint, refund_request]
      blocked_intents: [gratitude]
      request_intents: [refund_request]
      topic_patterns: ['двойн|дважды|два раза|\btwice\b|\bduplicate\b']
      evidence_patterns: ['двойн|дважды|два раза|\btwice\b|\bduplicate\b']
      operation: {product: [debit_card], op_type: [card_payment]}
  - code: RULE-PROMO-RATE-001
    name_ru: "Ставка вклада ниже промо в окне акции"
    name_en: "Deposit rate below promo inside promo window"
    condition: {all: [{field: operation.op_type, eq: deposit_open}, {field: operation.started_sim, within_promo: PROMO-DEP-14}, {field: client_product.terms.rate_pct, lt: promo.rate}]}
    action: propose_hitl
    limits: {}
    owner_team_code: team_promo
    error_code: PROMO-RATE-MISMATCH
    is_active: true
  - code: RULE-NOTIF-DUP-001
    name_ru: "Дубли уведомлений"
    name_en: "Duplicate notifications"
    condition: {all: [{field: notification.kind, any: true}, {count_within_min: 10, gte: 3, by: [client_id, template_code]}]}
    action: suppress_duplicates
    limits: {}
    owner_team_code: team_notifications
    error_code: NOTIF-DELAY
    is_active: true
  - code: RULE-REPEAT-7D-001
    name_ru: "Повторное обращение за 7 дней"
    name_en: "Repeat contact within 7 days"
    condition: {all: [{field: client.signals_7d, gte: 2}]}
    action: notify_only
    limits: {}
    owner_team_code: team_cx
    error_code: null
    is_active: true

# Консервативная граница автономного денежного case. Новое правило без case_scope
# не получает matched в агентском проходе; лимиты/condition/HITL не изменяются.
refund_case_context:
  version: 1
  blocked_patterns:
    - 'не\s+узна[юе]|не\s+совершал|не\s+я\b|мошенн|украл|unauthori[sz]ed|do not recogni[sz]e'
    - 'комисси(?:ю|я|и)\s+не\s+(?:спис|удерж|взима)'
    - 'fee\s+(?:was|is)\s+not\s+charged'
  operation_hints:
    qr_payment: {method: [qr_sbp]}
    card_payment: {op_type: [card_payment], method: [card]}
    transfer: {op_type: [transfer]}
    withdrawal: {method: [cash]}
    deposit: {product: [deposit]}
    loan_payment: {op_type: [loan_payment]}
    notification: {deny: true}
    login: {deny: true}

  # Диагностические факты не означают право возврата: financial deny выше сохраняется.
  routing_operation_hints:
    notification: {system_path: [notification_gw]}
    login: {system_path: [mobile_app, web_bank]}
