# ТЗ 8.x / BRD — бизнес-правила (детерминированные, применяются до LLM). condition — DSL для app/rules/engine.py
business_rules:
  - code: RULE-QR-FEE-001
    name_ru: "Комиссия за оплату по QR (СБП) при нулевом тарифе"
    name_en: "QR/SBP fee charged while tariff is zero"
    condition: {all: [{field: operation.op_type, eq: card_payment}, {field: operation.method, eq: qr_sbp}, {field: operation.fee_amount, gt: 0}, {field: tariff.fee_pct, eq: 0}]}
    action: refund_fee
    limits: {max_amount_rub: 5000, per_client_30d: 3}
    owner_team_code: team_processing
    error_code: PROC-QR-FEE-CHARGED
    is_active: true
  - code: RULE-DOUBLE-DEBIT-001
    name_ru: "Двойное списание"
    name_en: "Double debit"
    condition: {all: [{field: ledger.kind, eq: debit}, {duplicate_within_s: 120, by: [amount, merchant]}]}
    action: refund_fee
    limits: {max_amount_rub: 50000, per_client_30d: 2}
    owner_team_code: team_processing
    error_code: PROC-DOUBLE-DEBIT
    is_active: true
  - code: RULE-PROMO-RATE-001
    name_ru: "Ставка вклада ниже промо в окне акции"
    name_en: "Deposit rate below promo inside promo window"
    condition: {all: [{field: operation.op_type, eq: deposit_open}, {field: operation.started_sim, within_promo: PROMO-DEP-14}, {field: client_product.terms.rate_pct, lt: promo.rate}]}
    action: propose_hitl
    limits: {}
    owner_team_code: team_promo
    error_code: PROMO-RATE-MISMATCH
    is_active: true
  - code: RULE-NOTIF-DUP-001
    name_ru: "Дубли уведомлений"
    name_en: "Duplicate notifications"
    condition: {all: [{field: notification.kind, any: true}, {count_within_min: 10, gte: 3, by: [client_id, template_code]}]}
    action: suppress_duplicates
    limits: {}
    owner_team_code: team_notifications
    error_code: NOTIF-DELAY
    is_active: true
  - code: RULE-REPEAT-7D-001
    name_ru: "Повторное обращение за 7 дней"
    name_en: "Repeat contact within 7 days"
    condition: {all: [{field: client.signals_7d, gte: 2}]}
    action: notify_only
    limits: {}
    owner_team_code: team_cx
    error_code: null
    is_active: true
