# Шаблоны уведомлений клиенту (Jinja2). channel '*' = по умолчанию для всех каналов (сид раскладывает по каналам chat, email, telegram_bot, proactive, social)
templates:
  # Разъяснение доступно только для будущего подтверждённого руководителем пути;
  # наличие шаблона само по себе не запускает отправку и не меняет HITL.
  - {code: misselling_clarification, channel: "*", segment: null, subject: "Разъяснение по вашему обращению", body: "{{ name }}, по вашему обращению: {{ clarification }}. Если остались вопросы, пожалуйста, напишите нам.", variables: [name, clarification]}
  - {code: misselling_clarification, channel: "*", segment: null, lang: en, subject: "A clarification about your request", body: "{{ name }}, regarding your request: {{ clarification }}. Please contact us if you have any further questions.", variables: [name, clarification]}
  - {code: ack_received,     channel: "*", segment: null,      subject: "Мы получили ваше обращение", body: "{{ name }}, спасибо за обращение. Мы уже разбираемся: {{ summary }}. Ответим в течение {{ sla_minutes }} минут.", variables: [name, summary, sla_minutes]}
  - {code: ack_received,     channel: "*", segment: null,      lang: en, subject: "We have received your request", body: "{{ name }}, thank you for your request. We are already looking into it: {{ summary }}. We will reply within {{ sla_minutes }} minutes.", variables: [name, summary, sla_minutes]}
  - {code: ack_received,     channel: "*", segment: youth,     subject: "Получили, разбираемся", body: "{{ name }}, спасибо, что написали! Уже смотрим, что случилось: {{ summary }}. Вернёмся с ответом за {{ sla_minutes }} мин.", variables: [name, summary, sla_minutes]}
  - {code: ack_received,     channel: "*", segment: youth,     lang: en, subject: "Received, we are looking into it", body: "{{ name }}, thank you for writing. We are already checking what happened: {{ summary }}. We will get back within {{ sla_minutes }} minutes.", variables: [name, summary, sla_minutes]}
  - {code: ack_received,     channel: "*", segment: vip,       subject: "Ваше обращение принято персональным менеджером", body: "{{ name }}, ваш персональный менеджер {{ manager }} принял обращение в работу: {{ summary }}. Свяжемся в течение {{ sla_minutes }} минут.", variables: [name, summary, sla_minutes, manager]}
  - {code: ack_received,     channel: "*", segment: vip,       lang: en, subject: "Your personal manager has accepted the request", body: "{{ name }}, your personal manager {{ manager }} has taken the request: {{ summary }}. We will contact you within {{ sla_minutes }} minutes.", variables: [name, summary, sla_minutes, manager]}
  - {code: ack_received,     channel: "*", segment: ultra_vip, subject: "Обращение принято", body: "{{ name }}, ваше обращение принято лично {{ manager }}. Решение будет согласовано с вами в течение {{ sla_minutes }} минут.", variables: [name, summary, sla_minutes, manager]}
  - {code: ack_received,     channel: "*", segment: ultra_vip, lang: en, subject: "Request accepted", body: "{{ name }}, your request has been accepted personally by {{ manager }}. The next step will be agreed with you within {{ sla_minutes }} minutes.", variables: [name, summary, sla_minutes, manager]}
  - {code: proactive_fault,  channel: "*", segment: null,      subject: "Видим проблему и уже чиним", body: "{{ name }}, мы заметили сбой, который мог затронуть вашу операцию ({{ product_name }}). Уже исправляем, ожидаемое время — {{ eta }}. Ничего делать не нужно.", variables: [name, product_name, eta]}
  - {code: proactive_fault,  channel: "*", segment: null,      lang: en, subject: "We see the problem and are already fixing it", body: "{{ name }}, we noticed a failure that may have affected your transaction ({{ product_name }}). We are already fixing it. Expected time: {{ eta }}. You do not need to do anything.", variables: [name, product_name, eta]}
  - {code: proactive_fault,  channel: "*", segment: social,    subject: "Мы видим проблему, всё под контролем", body: "{{ name }}, произошёл технический сбой, он мог затронуть вашу операцию. Мы его устраняем, ваши деньги в безопасности. Если удобно, сотрудник позвонит вам.", variables: [name, product_name, eta]}
  - {code: proactive_fault,  channel: "*", segment: social,    lang: en, subject: "We see the problem and have it under control", body: "{{ name }}, there was a technical failure that may have affected your transaction. We are fixing it, and your money is safe. If it is convenient, an employee can call you.", variables: [name, product_name, eta]}
  - {code: progress_update,  channel: "*", segment: null,      subject: "Как идёт решение вашего вопроса", body: "{{ name }}, по вашему обращению {{ summary }}: {{ progress }}. Планируем завершить {{ eta }}.", variables: [name, summary, progress, eta]}
  - {code: progress_update,  channel: "*", segment: null,      lang: en, subject: "How your request is progressing", body: "{{ name }}, about your request {{ summary }}: {{ progress }}. We plan to finish by {{ eta }}.", variables: [name, summary, progress, eta]}
  - {code: resolved,         channel: "*", segment: null,      subject: "Вопрос решён", body: "{{ name }}, ваш вопрос решён: {{ resolution }}. Если что-то осталось непонятным — просто ответьте на это сообщение.", variables: [name, resolution]}
  - {code: resolved,         channel: "*", segment: null,      lang: en, subject: "The issue is resolved", body: "{{ name }}, your issue is resolved: {{ resolution }}. If something is still unclear, just reply to this message.", variables: [name, resolution]}
  - {code: resolved,         channel: "*", segment: premium,   subject: "Ваш вопрос решён", body: "{{ name }}, благодарим за терпение. {{ resolution }}. Будем рады помочь снова.", variables: [name, resolution]}
  - {code: resolved,         channel: "*", segment: premium,   lang: en, subject: "Your issue is resolved", body: "{{ name }}, thank you for your patience. {{ resolution }}. We will be glad to help again.", variables: [name, resolution]}
  - {code: gift_offer,       channel: "*", segment: null,      subject: "Небольшая компенсация за неудобства", body: "{{ name }}, нам жаль, что так вышло. В знак извинения начислили {{ gift }}. Спасибо, что остаётесь с нами.", variables: [name, gift]}
  - {code: gift_offer,       channel: "*", segment: null,      lang: en, subject: "A small apology for the inconvenience", body: "{{ name }}, we are sorry this happened. As an apology we have added {{ gift }}. Thank you for staying with us.", variables: [name, gift]}
  - {code: gift_offer,       channel: "*", segment: vip,       subject: "С извинениями", body: "{{ name }}, приносим извинения за ситуацию. Для вас — {{ gift }}. Ваш менеджер {{ manager }} на связи.", variables: [name, gift, manager]}
  - {code: gift_offer,       channel: "*", segment: vip,       lang: en, subject: "With apologies", body: "{{ name }}, we are sorry about the situation. For you: {{ gift }}. Your manager {{ manager }} is available.", variables: [name, gift, manager]}
  - {code: clarify_request,  channel: "*", segment: null,      subject: "Нужно уточнение", body: "{{ name }}, чтобы быстрее помочь, уточните, пожалуйста: {{ question }}.", variables: [name, question]}
  - {code: clarify_request,  channel: "*", segment: null,      lang: en, subject: "A clarification is needed", body: "{{ name }}, to help you faster, please clarify: {{ question }}.", variables: [name, question]}
  - {code: refund_done,      channel: "*", segment: null,      subject: "Возврат выполнен", body: "{{ name }}, мы вернули {{ amount }} ₽ на карту {{ card4 }}. Операция уже отражена в выписке.", variables: [name, amount, card4]}
  - {code: refund_done,      channel: "*", segment: null,      lang: en, subject: "The refund is complete", body: "{{ name }}, we have returned {{ amount }} RUB to card {{ card4 }}. The transaction is already on your statement.", variables: [name, amount, card4]}
  - {code: public_reply,     channel: social, segment: null,   subject: null, body: "Здравствуйте! Нам жаль, что так получилось. Мы уже разбираемся и напишем вам в личные сообщения, чтобы уточнить детали и помочь.", variables: []}
  - {code: public_reply,     channel: social, segment: null,   lang: en, subject: null, body: "Hello! We are sorry this happened. We are already looking into it and will message you privately to clarify the details and help.", variables: []}
  - {code: public_reply,     channel: review_portal, segment: null, subject: null, body: "Здравствуйте! Спасибо за отзыв, нам важно разобраться. Напишите, пожалуйста, в личные сообщения или чат приложения — поможем и вернёмся с результатом здесь.", variables: []}
  - {code: public_reply,     channel: review_portal, segment: null, lang: en, subject: null, body: "Hello! Thank you for the review. It matters that we look into it. Please write in a private message or the app chat, and we will come back with the result here.", variables: []}
  - {code: dm_invite, channel: "*", segment: null, subject: "Продолжим в личных сообщениях", body: "{{ name }}, чтобы помочь с вашим обращением, напишите нам в личные сообщения или чат приложения. Не публикуйте личные данные в открытом обсуждении.", variables: [name]}
  - {code: dm_invite, channel: "*", segment: null, lang: en, subject: "Let us continue privately", body: "{{ name }}, please contact us in a private message or the app chat so we can help with your request. Please keep personal information out of public discussions.", variables: [name]}
  - {code: closure_ack, channel: "*", segment: null, subject: "Запрос на закрытие получен", body: "{{ name }}, получили ваш запрос на закрытие и передали ответственному сотруднику. Сообщим вам о результате.", variables: [name]}
  - {code: closure_ack, channel: "*", segment: null, lang: en, subject: "Your closure request has been received", body: "{{ name }}, we have received your closure request and passed it to the responsible colleague. We will let you know the outcome.", variables: [name]}
  - {code: team_notice,      channel: proactive, segment: null, subject: "Новый инцидент {{ incident_id }}", body: "{{ title }} · критичность {{ criticality }} · SLA до {{ due }} · система {{ system }}. Клиентов затронуто: {{ affected }}.", variables: [incident_id, title, criticality, due, system, affected]}
channels_for_star: [chat, email, telegram_bot, proactive, social, call, landing, branch, review_portal, voice_input, branch_audio, csi_survey]
