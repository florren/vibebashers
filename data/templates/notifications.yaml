# Шаблоны уведомлений клиенту (Jinja2). channel '*' = по умолчанию для всех каналов (сид раскладывает по каналам chat, email, telegram_bot, proactive, social)
templates:
  - {code: ack_received,     channel: "*", segment: null,      subject: "Мы получили ваше обращение", body: "{{ name }}, спасибо за обращение. Мы уже разбираемся: {{ summary }}. Ответим в течение {{ sla_minutes }} минут.", variables: [name, summary, sla_minutes]}
  - {code: ack_received,     channel: "*", segment: youth,     subject: "Получили, разбираемся", body: "{{ name }}, спасибо, что написали! Уже смотрим, что случилось: {{ summary }}. Вернёмся с ответом за {{ sla_minutes }} мин.", variables: [name, summary, sla_minutes]}
  - {code: ack_received,     channel: "*", segment: vip,       subject: "Ваше обращение принято персональным менеджером", body: "{{ name }}, ваш персональный менеджер {{ manager }} принял обращение в работу: {{ summary }}. Свяжемся в течение {{ sla_minutes }} минут.", variables: [name, summary, sla_minutes, manager]}
  - {code: ack_received,     channel: "*", segment: ultra_vip, subject: "Обращение принято", body: "{{ name }}, ваше обращение принято лично {{ manager }}. Решение будет согласовано с вами в течение {{ sla_minutes }} минут.", variables: [name, summary, sla_minutes, manager]}
  - {code: proactive_fault,  channel: "*", segment: null,      subject: "Видим проблему и уже чиним", body: "{{ name }}, мы заметили сбой, который мог затронуть вашу операцию ({{ product_name }}). Уже исправляем, ожидаемое время — {{ eta }}. Ничего делать не нужно.", variables: [name, product_name, eta]}
  - {code: proactive_fault,  channel: "*", segment: social,    subject: "Мы видим проблему, всё под контролем", body: "{{ name }}, произошёл технический сбой, он мог затронуть вашу операцию. Мы его устраняем, ваши деньги в безопасности. Если удобно, сотрудник позвонит вам.", variables: [name, product_name, eta]}
  - {code: progress_update,  channel: "*", segment: null,      subject: "Как идёт решение вашего вопроса", body: "{{ name }}, по вашему обращению {{ summary }}: {{ progress }}. Планируем завершить {{ eta }}.", variables: [name, summary, progress, eta]}
  - {code: resolved,         channel: "*", segment: null,      subject: "Вопрос решён", body: "{{ name }}, ваш вопрос решён: {{ resolution }}. Если что-то осталось непонятным — просто ответьте на это сообщение.", variables: [name, resolution]}
  - {code: resolved,         channel: "*", segment: premium,   subject: "Ваш вопрос решён", body: "{{ name }}, благодарим за терпение. {{ resolution }}. Будем рады помочь снова.", variables: [name, resolution]}
  - {code: gift_offer,       channel: "*", segment: null,      subject: "Небольшая компенсация за неудобства", body: "{{ name }}, нам жаль, что так вышло. В знак извинения начислили {{ gift }}. Спасибо, что остаётесь с нами.", variables: [name, gift]}
  - {code: gift_offer,       channel: "*", segment: vip,       subject: "С извинениями", body: "{{ name }}, приносим извинения за ситуацию. Для вас — {{ gift }}. Ваш менеджер {{ manager }} на связи.", variables: [name, gift, manager]}
  - {code: clarify_request,  channel: "*", segment: null,      subject: "Нужно уточнение", body: "{{ name }}, чтобы быстрее помочь, уточните, пожалуйста: {{ question }}.", variables: [name, question]}
  - {code: refund_done,      channel: "*", segment: null,      subject: "Возврат выполнен", body: "{{ name }}, мы вернули {{ amount }} ₽ на карту {{ card4 }}. Операция уже отражена в выписке.", variables: [name, amount, card4]}
  - {code: public_reply,     channel: social, segment: null,   subject: null, body: "Здравствуйте! Нам жаль, что так получилось. Мы уже разбираемся и напишем вам в личные сообщения, чтобы уточнить детали и помочь.", variables: []}
  - {code: public_reply,     channel: review_portal, segment: null, subject: null, body: "Здравствуйте! Спасибо за отзыв, нам важно разобраться. Напишите, пожалуйста, в личные сообщения или чат приложения — поможем и вернёмся с результатом здесь.", variables: []}
  - {code: team_notice,      channel: proactive, segment: null, subject: "Новый инцидент {{ incident_id }}", body: "{{ title }} · критичность {{ criticality }} · SLA до {{ due }} · система {{ system }}. Клиентов затронуто: {{ affected }}.", variables: [incident_id, title, criticality, due, system, affected]}
channels_for_star: [chat, email, telegram_bot, proactive, social, call, landing, branch, review_portal, voice_input, branch_audio]
