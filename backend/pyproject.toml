[project]
name = "cx-pulse-backend"
version = "0.1.0"
description = "CX Pulse Control — backend (FastAPI, PostgreSQL 16, LangGraph)"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy[asyncio]>=2.0.36,<2.1",
  "psycopg[binary,pool]>=3.2",
  "alembic>=1.13",
  "pydantic[email]>=2.9",
  "pydantic-settings>=2.5",
  "structlog>=24.4",
  "httpx>=0.27",
  "pyyaml>=6.0",
  "jsonschema>=4.23",
  "orjson>=3.10",
  "python-multipart>=0.0.12",
  "qrcode>=8.0",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "ruff>=0.6",
  "mypy>=1.11",
  "datamodel-code-generator>=0.26",
  "sqlacodegen>=3.0.0",
  "types-PyYAML",
  "openapi-spec-validator>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["app/db/models.py", "app/contracts/enums.py", "app/contracts/events", "app/agent/schemas.py", "app/compliance/schemas.py", "app/rules/schemas.py", "app/ingest/schemas.py", "alembic"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "T20"]
ignore = ["B008", "E501"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["alembic/", "app/db/models.py"]
ignore_missing_imports = true

[[tool.mypy.overrides]]  # сгенерированный код (datamodel-codegen) — проверяется тестами на examples, не типами
module = ["app.contracts.events.*", "app.contracts.enums"]
ignore_errors = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["integration: нужна PostgreSQL (DATABASE_URL_TEST)"]
