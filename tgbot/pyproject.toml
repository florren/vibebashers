[project]
name = "cx-pulse-tgbot"
version = "0.1.0"
description = "CX Pulse Control — Telegram long polling transport"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aiogram>=3.31,<4",
    "httpx>=0.28.1,<0.29",
    "structlog>=24.4",
]

[project.scripts]
cx-tgbot = "cx_tgbot.main:main"

[dependency-groups]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.6", "mypy>=1.11"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cx_tgbot"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "T20"]
ignore = ["B008", "E501"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
